<html lang="tr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalori">
<title>Kalori – Beslenme & Su Takibi</title>

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#f4f7f5; --card:#ffffff; --ink:#15231c; --muted:#6b7a72; --line:#e3ebe6;
  --green:#10b981; --green-d:#059669; --green-l:#d1fae5;
  --blue:#3b82f6; --blue-l:#dbeafe; --orange:#f59e0b; --red:#ef4444; --purple:#8b5cf6;
  --radius:18px; --shadow:0 2px 10px rgba(20,40,30,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1512; --card:#18211c; --ink:#e8f0eb; --muted:#93a39a; --line:#26322b;
    --green-l:#11372a; --blue-l:#162a46; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.app{max-width:520px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
header.top h1{font-size:22px;margin:0;font-weight:800}
header.top .sub{color:var(--muted);font-size:13px}
.sync{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:4px 8px;border-radius:99px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:6px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11px}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:#fff;transition:transform .08s, opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--green-l);color:var(--green-d)}
.btn.blue{background:var(--blue)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* ring */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:28px;font-weight:800;line-height:1}
.stats{flex:1;display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;font-size:14px}
.stat b{font-weight:800}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro .lbl{font-size:12px;color:var(--muted);font-weight:700}
.macro .val{font-size:14px;font-weight:800;margin:2px 0 4px}
/* water */
.water{display:flex;align-items:center;gap:14px}
.glass{width:58px;height:84px;border:3px solid var(--blue);border-top-width:0;border-radius:0 0 14px 14px;position:relative;overflow:hidden;flex:none}
.glass i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#60a5fa,#2563eb);transition:height .5s}
.water .amt{font-size:24px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
/* food list */
.meal{margin-top:6px}
.meal-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;padding:8px 0 4px;border-top:1px dashed var(--line)}
.meal:first-child .meal-h{border-top:0}
.food{display:flex;align-items:center;gap:8px;padding:7px 0}
.food .n{flex:1;min-width:0}
.food .n div:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food .k{font-weight:800;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav.tabs button .ic{font-size:22px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--green-d)}
nav.tabs button.on .ic{filter:none;opacity:1}
nav.tabs button.add .ic{background:var(--green);color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 14px rgba(16,185,129,.4);filter:none;opacity:1;font-size:26px}
/* misc */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;padding:9px;border-radius:10px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.res-item{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.res-item .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.res-item .grid4 input{padding:7px 6px;font-size:14px;text-align:center}
.res-item .grid4 span{font-size:10px;color:var(--muted);display:block;text-align:center;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:12px;cursor:pointer}
.day.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-l)}
.day .d{font-weight:800;font-size:15px}
.day .m{font-size:14px;min-height:18px}
.hist{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hist .col i{width:100%;border-radius:8px 8px 4px 4px;background:var(--green);min-height:2px}
.hist .col i.over{background:var(--orange)}
.hist .col span{font-size:10px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#15231c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.remind{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:500px;margin:0 auto;background:var(--blue);color:#fff;border-radius:16px;padding:14px;z-index:60;box-shadow:0 10px 30px rgba(37,99,235,.35);display:none;animation:drop .35s ease}
.remind.show{display:block}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.remind .btn{background:#fff;color:var(--blue)}
.remind .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.sugg{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.sugg .t{font-weight:800}
.photo-prev{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:10px;display:none}
.hide{display:none!important}
.search-res .food{cursor:pointer;border-bottom:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--green-l);color:var(--green-d)}
.hero{text-align:center;padding:10px 4px 4px}
.hero .em{font-size:52px}
.hero h2{justify-content:center;font-size:22px}
.note{background:var(--green-l);color:var(--green-d);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.warn{background:#fef3c7;color:#92400e}
.star{border:0;background:transparent;font-size:18px;cursor:pointer;padding:4px 4px;color:var(--muted);line-height:1}
.star.on{color:var(--orange)}
.qlist .food{border-bottom:1px solid var(--line)}
.qlist .food:last-child{border-bottom:0}
.qlist .food .n{cursor:pointer}
.chart{width:100%;height:auto;display:block;margin-top:8px;touch-action:manipulation}
.chart text{font-family:inherit;font-size:10px;fill:var(--muted);font-weight:700}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.wk .tiny{margin-bottom:1px}
.tips{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.tips li{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.prod{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.scanner{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-box{position:relative;width:78%;max-width:340px;height:150px;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scan-tip{position:relative;color:#fff;margin-top:14px;font-weight:700;text-align:center;padding:0 16px}
.scanner .btn{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));color:#fff;border-color:rgba(255,255,255,.6)}
</style>
</head>

function targets(){
  const p=S.profile; if(!p) return null;
  const w=+p.weight,h=+p.height,a=+p.age;
  const bmr=10*w+6.25*h-5*a+(p.sex==="m"?5:-161);
  const tdee=bmr*(+p.activity||1.2);
  const g=GOALS.find(x=>x[0]===p.goal)||GOALS[1];
  const floor=p.sex==="m"?1500:1200;
  let kcal=Math.round((tdee+g[2])/10)*10;
  let floored=false; if(kcal<floor){kcal=floor;floored=true;}
  const protein=Math.round(w*(p.goal==="keep"?1.2:1.6));
  const fat=Math.round(kcal*0.28/9);
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  const water=Math.round(w*33/100)*100;
  const bmi=w/((h/100)**2);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,protein,fat,carbs,water,bmi,floored};
}
function totals(k=todayKey()){const d=day(k);return d.foods.reduce((t,f)=>({kcal:t.kcal+(+f.kcal||0),p:t.p+(+f.p||0),c:t.c+(+f.c||0),f:t.f+(+f.f||0)}),{kcal:0,p:0,c:0,f:0});}

const API_URL = "https://kalori-ai.ulkueralp20.workers.dev/";
const API_BASE = API_URL.replace(/\/+$/,"");

function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b);});}
async function askJSON(prompt,opts={}){
  if(!AI) throw new Error("no-ai");
  const body={prompt};
  if(opts.images&&opts.images[0]){body.image={mime:opts.images[0].type||"image/jpeg",data:await blobToB64(opts.images[0])};}
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),60000);
  let r;
  try{r=await fetch(API_BASE+"/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});}
  catch(err){const e=new Error("net");e.code=err&&err.name==="AbortError"?"timeout":(navigator.onLine===false?"offline":"network");throw e;}
  finally{clearTimeout(tm);}
  if(r.status===429){const e=new Error("rate");e.code="rate_limited";throw e;}
  if(r.status===503||r.status===502||r.status===504||r.status===524){const e=new Error("busy");e.code="busy";throw e;}
  if(r.status===403){const e=new Error("origin");e.code="origin";throw e;}
  if(!r.ok){const e=new Error("http "+r.status);e.code="http";e.status=r.status;throw e;}
  const j=await r.json();
  let val=j.text??j;
  if(typeof val==="string"){const m=val.match(/\{[\s\S]*\}/);val=JSON.parse(m?m[0]:val);}
  return val;
}
/* ============ Telefon bildirimleri (Web Push) ============ */
// Bildirimi Cloudflare Worker gönderir; uygulama kapalı, ekran kilitliyken de gelir.
// iPhone'da yalnızca ana ekrana eklenmiş uygulamada çalışır (iOS 16.4+).
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function pushState(){
  if(!API_BASE) return "noapi";
  if(!("serviceWorker" in navigator)||!window.isSecureContext) return "unsupported";
  if(isIOS()&&!isStandalone()) return "ios-install";
  if(!("PushManager" in window)||!("Notification" in window)) return "unsupported";
  if(Notification.permission==="denied") return "denied";
  return S.settings.push?"on":"off";
}
async function api(path,body){const r=await fetch(API_BASE+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error("http "+r.status);return r.json();}
function b64uToU8(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const b=atob(s+"===".slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0));}
const hmToMin=s=>{const m=/^(\d{2}):(\d{2})$/.exec(s||"");return m?(+m[1])*60+(+m[2]):-1;};
const mealMins=()=>MEALS.map(([k])=>hmToMin(S.settings.mealRem.t[k]));
function mealBitsToday(){const d=S.days[todayKey()];if(!d)return 0;return MEALS.reduce((b,[k],i)=>b|(d.foods.some(f=>f.meal===k)?1<<i:0),0);}
function pushPayload(sub){const T=targets();return {subscription:sub,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Istanbul",interval:S.settings.reminderMin,start:S.settings.wakeStart,end:S.settings.wakeEnd,goal:T?T.water:2000,enabled:S.settings.reminders,mealsOn:S.settings.mealRem.on,meals:mealMins()};}
function pushSigNow(){const T=targets();return JSON.stringify([S.settings.reminders,S.settings.reminderMin,S.settings.wakeStart,S.settings.wakeEnd,T&&T.water,S.settings.mealRem.on,mealMins()]);}
async function enablePush(){
  let st=pushState(); if(st!=="off"&&st!=="on") return render();
  pushBusy=true;render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Bildirim izni verilmedi");return;}
    const reg=await navigator.serviceWorker.ready;
    const {publicKey}=await api("/push/key");
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(publicKey)});
    const js=sub.toJSON();
    await api("/push/subscribe",pushPayload(js));
    S.settings.push=true;S.settings.pushEndpoint=js.endpoint;S.settings.pushSig=pushSigNow();S.settings.reminders=true;save();
    toast("Bildirimler açıldı ✓");
    api("/push/test",{endpoint:js.endpoint}).catch(()=>{});
  }catch(e){toast("Bildirimler açılamadı, tekrar dene");}
  finally{pushBusy=false;render();}
}
async function disablePush(){
  const ep=S.settings.pushEndpoint;
  pushBusy=true;render();
  try{if(ep) await api("/push/unsubscribe",{endpoint:ep}).catch(()=>{});
    const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(sub) await sub.unsubscribe().catch(()=>{});}catch(e){}
  S.settings.push=false;S.settings.pushEndpoint="";save();pushBusy=false;render();toast("Telefon bildirimleri kapatıldı");
}
let pushBusy=false, pushSyncT=null;
// Ayarlar ya da su hedefi değişince sunucuyu güncelle; hedef tamamlanınca o gün bildirimi durdur
function pushAfterSave(){
  if(!S.settings.push||!S.settings.pushEndpoint||!API_BASE) return;
  const T=targets(); if(!T) return;
  if(pushSigNow()!==S.settings.pushSig){
    clearTimeout(pushSyncT);
    pushSyncT=setTimeout(async()=>{try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
      if(!sub){S.settings.push=false;saveLocal();return render();}
      await api("/push/subscribe",pushPayload(sub.toJSON()));S.settings.pushSig=pushSigNow();S.settings.pushEndpoint=sub.endpoint;saveLocal();}catch(e){}},1500);
  }
  const k=todayKey(),done=(S.days[k]&&S.days[k].water>=T.water)?k:"";
  if(done!==(S.settings.pushDone||"")){S.settings.pushDone=done;saveLocal();api("/push/done",{endpoint:S.settings.pushEndpoint,date:done}).catch(()=>{});}
  // Öğün hatırlatması: bugün hangi öğünlere bir şey eklendiğini sunucuya bildir (o öğün için bildirim gitmesin)
  if(S.settings.mealRem.on){const bits=mealBitsToday(),md=k+":"+bits;
    if(md!==(S.settings.pushMealDone||"")){S.settings.pushMealDone=md;saveLocal();if(bits)api("/push/meal",{endpoint:S.settings.pushEndpoint,date:k,bits}).catch(()=>{});}}
}

async function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return toast("Bu tarayıcıda kamera açılamıyor, numarayı elle yaz");
  stopScan();
  const ov=document.createElement("div");ov.className="scanner";
  ov.innerHTML=`<video playsinline muted autoplay></video><div class="scan-box"></div><div class="scan-tip">Barkodu çerçevenin içine getir</div><button class="btn ghost">Kapat</button>`;
  document.body.appendChild(ov);
  const me={ov,stop:()=>{}};scan=me;
  ov.querySelector("button").onclick=stopScan;
  const video=ov.querySelector("video");
  const found=code=>{if(scan!==me)return;stopScan();try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}lookupBarcode(code);};
  try{
    let native=false;
    try{native="BarcodeDetector" in window&&(await BarcodeDetector.getSupportedFormats()).includes("ean_13");}catch(e){}
    if(native){
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
      if(scan!==me){stream.getTracks().forEach(t=>t.stop());return;}
      let alive=true;me.stop=()=>{alive=false;stream.getTracks().forEach(t=>t.stop());};
      video.srcObject=stream;await video.play().catch(()=>{});
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
      const loop=async()=>{if(!alive)return;try{const r=await det.detect(video);if(r.length)return found(r[0].rawValue);}catch(e){}setTimeout(loop,200);};
      loop();
    }else{
      ov.querySelector(".scan-tip").textContent="Tarayıcı hazırlanıyor…";
      await loadZXing();
      if(scan!==me)return;
      const Z=window.ZXing,hints=new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
      const reader=new Z.BrowserMultiFormatReader(hints,200);
      me.stop=()=>{try{reader.reset();}catch(e){}};
      ov.querySelector(".scan-tip").textContent="Barkodu çerçevenin içine getir";
      await reader.decodeFromConstraints({video:{facingMode:"environment"},audio:false},video,res=>{if(res)found(res.getText());});
      if(scan!==me){try{reader.reset();}catch(e){}}
    }
  }catch(e){if(scan===me){stopScan();toast(e&&e.name==="NotAllowedError"?"Kamera izni verilmedi. Numarayı elle yazabilirsin.":"Kamera açılamadı. Numarayı elle yazabilirsin.");}}
}

/* ---- Yerel tahmin: yapay zekâ çalışmazsa yazılanı yerel listeyle eşleştirir ---- */
const TR_ASCII={"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u"};
const normTR=s=>String(s||"").toLocaleLowerCase("tr").replace(/[çğıöşüâîû]/g,c=>TR_ASCII[c]);
const STOPW=new Set(["bucuk","adet","tane","dilim","porsiyon","bardak","kase","kasik","kasigi","fincan","avuc","paket","kutu","kupa","g","gr","gram","ml","lt","litre","kg","orta","buyuk","kucuk","biraz","bir","iki","uc","dort","bes","alti","yarim","ceyrek","tabak","kadeh","top","ile","ve","de","da","icin","sade","boy"]);
const NUMW={bir:1,iki:2,uc:3,dort:4,bes:5,alti:6,yedi:7,sekiz:8,dokuz:9,on:10,yarim:0.5,ceyrek:0.25};
const toks=s=>normTR(s).split(/[^a-z0-9]+/).filter(t=>t.length>=2&&!/^\d+$/.test(t)&&!STOPW.has(t));
let DB_IDX=null;
function dbIndex(){if(!DB_IDX)DB_IDX=FOOD_DB.map(f=>({f,main:toks(f.name.replace(/\(.*?\)/g," ")),par:toks((f.name.match(/\((.*?)\)/)||["",""])[1])}));return DB_IDX;}
// a: yazılan kelime, b: listedeki kelime. "corba"→"corbasi" (ek) güçlü, "salata"→"salatalik" (başka kelime) zayıf eşleşir.
function tokW(a,b){if(a===b)return 1;if(a.length>=3&&b.startsWith(a))return b.length-a.length>=3?.4:.7;if(b.length>=3&&a.startsWith(b))return .7;if(a.length>=5&&b.length>=5&&a.slice(0,4)===b.slice(0,4))return .6;return 0;}
function bestDB(q){let best=null,bs=.45;
  for(const it of dbIndex()){let s=0;const used=new Set();
    for(const t of q){let w=0,hit=null;for(const d of [...it.main,...it.par]){const x=tokW(t,d);if(x>w){w=x;hit=d;}}if(w){s+=w;used.add(hit);}}
    if(!s)continue;s-=it.main.filter(d=>!used.has(d)).length*.5+it.par.filter(d=>!used.has(d)).length*.25;
    if(s>bs){bs=s;best=it.f;}}
  return best;}
function localEstimate(txt){
  const items=[],missed=[];
  String(txt||"").split(/[,;\n+]|\s+ve\s+|\s+ile\s+/i).map(s=>s.trim()).filter(Boolean).forEach(part=>{
    let n=normTR(part).replace(/\b(cay|tatli|yemek)\s+kasig\w*/g," kasik ");
    let mult=1,grams=0,given=false,m;
    if((m=n.match(/^\s*(\d+(?:[.,]\d+)?)\s*(g|gr|gram|ml)\b/))){grams=parseFloat(m[1].replace(",","."));}
    else if((m=n.match(/^\s*(\d+(?:[.,]\d+)?)/))){mult=parseFloat(m[1].replace(",","."));given=true;}
    else if((m=n.match(/^\s*([a-z]+)\b/))&&NUMW[m[1]]!==undefined){mult=NUMW[m[1]];given=true;if(m[1]==="bir"&&/^\s*bir\s+bucuk/.test(n))mult=1.5;}
    const q=toks(n); const f=q.length?bestDB(q):null;
    if(!f){missed.push(part);return;}
    let amount=f.amount;
    const fmtN=x=>String(x).replace(".",",");
    // Listedeki porsiyon birden fazla adetse ("5 adet" zeytin), yazılan sayı adet sayısıdır: "5 zeytin" = 1 porsiyon
    const cu=/^(\d+)\s+(adet|tane|dilim|kare|top)\b/.exec(f.amount);
    const userUnit=(n.match(/\b(adet|tane|dilim|kare|top|porsiyon|kase|tabak)\b/)||[])[1];
    const sameUnit=!userUnit||userUnit===cu?.[2]||(userUnit==="tane"&&cu?.[2]==="adet");
    if(grams){const unit=/^\s*[\d.,]+\s*ml\b/.test(n)?" ml":" g";const dg=(f.amount.match(/(\d+)\s*(g|ml)\b/)||[])[1];
      if(dg){mult=grams/+dg;amount=grams+unit;}else amount=f.amount+" (yazdığın: "+grams+unit+")";}
    else if(given&&cu&&+cu[1]>1&&sameUnit){amount=fmtN(mult)+" "+cu[2];mult=mult/+cu[1];}
    else if(mult!==1)amount=fmtN(mult)+" × "+f.amount;
    mult=Math.min(20,Math.max(.1,mult||1));
    items.push({name:f.name,amount,kcal:r0(f.kcal*mult),p:+(f.p*mult).toFixed(1),c:+(f.c*mult).toFixed(1),f:+(f.f*mult).toFixed(1)});
  });
  return {items,missed};
}
function applyLocal(txt,why){

  return true;
}

function aiErr(e){if(e&&e.code==="not_granted")return"Yapay zekâ şu an kullanılamıyor.";if(e&&e.code==="rate_limited")return"Yapay zekâ günlük/dakikalık ücretsiz kotası doldu, biraz sonra tekrar dene.";const c=e&&e.code;
  if(c==="busy")return"Yapay zekâ (Google Gemini) şu an çok yoğun. Birkaç dakika sonra tekrar dene ya da 🔎 yerel listeden ekle.";
  if(c==="timeout")return"Yapay zekâ zamanında cevap vermedi. Biraz sonra tekrar dener misin?";
  if(c==="offline")return"İnternet bağlantısı yok gibi görünüyor. Bağlanınca tekrar dene ya da 🔎 yerel listeden ekle.";
  if(c==="network")return"Sunucuya ulaşılamadı. İnternet bağlantını kontrol edip tekrar dener misin?";
  if(c==="origin")return"Sunucu bu adrese izin vermiyor (ALLOWED_ORIGIN ayarını kontrol et).";
  if(e instanceof SyntaxError)return"Yapay zekânın cevabı anlaşılamadı, tekrar dener misin?";
  return"Hesaplanamadı"+(e&&e.status?" (hata "+e.status+")":"")+". Biraz sonra tekrar dener misin?";}

function weekStats(off){ // off=1 → dün dahil geriye 7 gün (bugün eksik olduğu için hariç)
  const T=targets();const o={logged:0,kcal:0,p:0,c:0,f:0,water:0,waterOk:0,sport:0,sportPlanned:0,onT:0};
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-off-i);const k=keyOf(d),dd=S.days[k];
    if(S.plan.sport[(d.getDay()+6)%7])o.sportPlanned++;
    if(!dd)continue;o.water+=dd.water||0;if(dd.water>=T.water)o.waterOk++;if(dd.sport)o.sport++;
    if(dd.foods.length){o.logged++;const t=totals(k);o.kcal+=t.kcal;o.p+=t.p;o.c+=t.c;o.f+=t.f;if(t.kcal>=T.kcal*.8&&t.kcal<=T.kcal*1.1)o.onT++;}}
  if(o.logged){o.kcal/=o.logged;o.p/=o.logged;o.c/=o.logged;o.f/=o.logged;}
  o.water/=7;return o;
}

  const box=(l,v)=>`<div><div class="tiny muted">${l}</div><b>${v}</b></div>`;
  if(!a.logged) return `<div class="card"><h2>🗓️ Haftalık özet</h2><p class="small muted" style="margin:0">Son 7 günde yemek kaydı yok. Birkaç gün kaydedince burada ortalamalarını ve önerileri göreceksin.</p></div>`;
  if(a.logged<4) tips.push(`📝 Son 7 günün sadece ${a.logged} gününde kayıt var. Daha çok gün kaydedersen özet daha doğru olur.`);
  if(a.kcal>T.kcal*1.1) tips.push(`🍽️ Ortalama kalorin hedefinin ${r0(a.kcal-T.kcal)} kcal üstünde. İçeceklere, atıştırmalıklara ve akşam porsiyonlarına göz atabilirsin.`);
  else if(a.kcal<Math.max(floor,T.kcal*.75)) tips.push(`⚠️ Ortalaman hedefinin oldukça altında (${r0(a.kcal)} kcal). Çok az yemek enerjini ve kas kütleni düşürebilir; öğün atlamamaya çalış. Belki de bazı öğünleri kaydetmeyi unuttun.`);
  else tips.push(`✅ Kalorin hedef aralığında. Böyle devam!`);
  if(a.p<T.protein*.8) tips.push(`🥚 Proteinin düşük kaldı (ort. ${r0(a.p)} g, hedef ${T.protein} g). Yumurta, yoğurt, lor, tavuk, balık, mercimek ya da nohut ekleyebilirsin.`);
  else if(a.p>=T.protein*.95) tips.push(`💪 Protein hedefini tutturdun (ort. ${r0(a.p)} g).`);
  if(a.f>T.fat*1.25) tips.push(`🫒 Yağ ortalaman hedefin üstünde (${r0(a.f)} g / ${T.fat} g). Kızartma ve hamur işlerini azaltmak işe yarar.`);
  if(a.waterOk<4) tips.push(`💧 Su hedefini 7 günün sadece ${a.waterOk} gününde tamamladın (ort. ${(a.water/1000).toFixed(1).replace(".",",")} L). Telefon bildirimleri yardımcı olabilir.`);
  else tips.push(`💧 Su hedefini 7 günün ${a.waterOk} gününde tamamladın.`);
  if(a.sportPlanned) tips.push(`🏃 Planladığın ${a.sportPlanned} spor gününün ${Math.min(a.sport,a.sportPlanned)} tanesini yaptın${a.sport>=a.sportPlanned?" 👏":"."}`);
  if(b.logged>=3&&a.logged>=3&&Math.abs(a.kcal-b.kcal)>=100) tips.push(`📊 Önceki haftaya göre günde ortalama ${r0(Math.abs(a.kcal-b.kcal))} kcal daha ${a.kcal<b.kcal?"az":"fazla"} aldın.`);
  const ws=S.weights.slice().sort((x,y)=>x.date-y.date),cut=Date.now()-7*864e5,bef=ws.filter(w=>w.date<cut).pop(),now=ws[ws.length-1];
  if(bef&&now&&now.date>=cut){const d=now.kg-bef.kg;tips.push(`⚖️ Bu hafta kilon ${Math.abs(d)<.05?"sabit kaldı":(d<0?"":"+")+d.toFixed(1).replace(".",",")+" kg değişti"}.`);}
  return `<div class="card"><h2>🗓️ Haftalık özet</h2><p class="tiny muted" style="margin:-4px 0 10px">Son 7 gün (bugün hariç)</p>
    <div class="wk">${box("Ort. kalori",`${r0(a.kcal)} <span class="tiny muted">/ ${T.kcal}</span>`)}${box("Ort. protein",`${r0(a.p)} <span class="tiny muted">/ ${T.protein} g</span>`)}
    ${box("Ort. su",`${(a.water/1000).toFixed(1).replace(".",",")} L`)}${box("Spor",`${a.sport} gün`)}${box("Hedef aralığında",`${a.onT} / ${a.logged} gün`)}${box("Kayıt tutulan",`${a.logged} / 7 gün`)}</div>
    <ul class="tips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
}

/* ---- Kilo grafiği (tek seri çizgi grafik, noktaya dokununca değer görünür) ---- */
const fmtKg=v=>(Math.round(v*10)/10).toFixed(1).replace(".",",");
const fmtD=d=>new Date(d).toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
let wPts=[];
function weightChartHTML(all){
  const ws=all.slice(-30);wPts=ws;
  const W=320,H=150,L=34,R=44,Tp=12,B=22;
  const kg=ws.map(w=>+w.kg);let lo=Math.min(...kg),hi=Math.max(...kg);const pv=Math.max(.5,(hi-lo)*.15);
  lo=Math.floor((lo-pv)*2)/2;hi=Math.ceil((hi+pv)*2)/2;
  const t0=ws[0].date,span=ws[ws.length-1].date-t0;
  const x=(w,i)=>L+(span>0?(w.date-t0)/span:i/(ws.length-1))*(W-L-R);
  const y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  const P=ws.map((w,i)=>[x(w,i),y(+w.kg)]);
  const grid=[hi,(hi+lo)/2,lo].map(v=>`<line x1="${L}" x2="${W-R+6}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${fmtKg(v)}</text>`).join("");
  const line="M"+P.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L");
  const lp=P[P.length-1],first=ws[0],last=ws[ws.length-1],df=last.kg-first.kg;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo grafiği: ${fmtD(first.date)} ${fmtKg(first.kg)} kg, ${fmtD(last.date)} ${fmtKg(last.kg)} kg">
    ${grid}
    <path d="${line}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${P.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--green)" stroke="var(--card)" stroke-width="2"/>`).join("")}
    <text x="${(lp[0]+8).toFixed(1)}" y="${(lp[1]+3).toFixed(1)}" style="fill:var(--ink);font-size:11px">${fmtKg(last.kg)}</text>
    <text x="${L}" y="${H-5}" text-anchor="start">${fmtD(first.date)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${fmtD(last.date)}</text>
    ${P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="13" fill="transparent" data-act="wPt" data-i="${i}" style="cursor:pointer"><title>${fmtD(ws[i].date)}: ${fmtKg(ws[i].kg)} kg</title></circle>`).join("")}
  </svg>
  <div class="tiny muted" id="wInfo" style="text-align:center;min-height:16px">Noktaya dokununca tarih ve kilo görünür</div>
  <p class="small" style="margin:6px 0 0;text-align:center">${fmtD(first.date)}: <b>${fmtKg(first.kg)} kg</b> → şimdi <b>${fmtKg(last.kg)} kg</b> <span style="color:${df<=0?"var(--green-d)":"var(--orange)"};font-weight:800">(${df>0?"+":""}${fmtKg(df)})</span></p>`;
}

/* ============ Olaylar ============ */
let resetArm=0;
document.addEventListener("click",async e=>{
  const tb=e.target.closest("[data-tab]"); if(tb){e.preventDefault();setTab(tb.dataset.tab);return;}
  const seg=e.target.closest(".seg button[data-v]"); if(seg){seg.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));seg.classList.add("on");return;}
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a!=="quickAdd"&&el.tagName==="A") e.preventDefault();
  switch(a){
    case "saveProfile":{const p=readProfile();if(!p)return;const first=!S.profile;
      if(!first&&+S.profile.weight!==p.weight)S.weights.push({date:Date.now(),kg:p.weight});
      if(first)S.weights.push({date:Date.now(),kg:p.weight});
      S.profile=p;save();TAB="today";render();toast(first?"Hedeflerin hazır! 🎯":"Güncellendi ✓");break;}
    case "water":{const d=day();d.water=Math.max(0,d.water+ +el.dataset.ml);save();render();
      if(+el.dataset.ml>0){lastRemind=Date.now();if(d.water>=targets().water&&d.water- +el.dataset.ml<targets().water)toast("Su hedefi tamam! 🎉");else toast("+"+el.dataset.ml+" ml 💧");}break;}
    case "toggleSport":{const d=day();d.sport=!d.sport;save();render();if(d.sport)toast("Tebrikler! 💪");break;}
    case "delFood":{const d=day();d.foods=d.foods.filter(f=>f.id!==el.dataset.id);save();render();break;}
    case "quickAdd":e.preventDefault();addMeal=el.dataset.meal;setTab("add");break;
    case "meal":addMeal=el.dataset.meal;render();showPreview();break;
    case "mode":addMode=el.dataset.mode;render();showPreview();break;
    case "analyzeText":analyzeText();break;
    case "analyzePhoto":viewAdd._pnote=document.getElementById("photoNote")?.value||"";analyzePhoto();break;
    case "pickDB":{const f=FOOD_DB.find(x=>x.name===el.dataset.name);if(f){pending.push({...f});render();toast(f.name+" eklendi, aşağıdan onayla");}break;}
    case "delPending":pending.splice(+el.dataset.i,1);render();showPreview();break;
    case "commitPending":{const d=day();pending.forEach(f=>d.foods.push({...f,id:uid(),meal:addMeal,kcal:+f.kcal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0,t:Date.now()}));
      const n=pending.length;pending=[];aiNote="";viewAdd._txt="";photoBlob=null;photoURL=null;save();TAB="today";render();toast(n+" yiyecek eklendi ✓");break;}
    case "savePlan":document.querySelectorAll("[data-sport]").forEach(i=>S.plan.sport[i.dataset.sport]=i.value.trim());
      document.querySelectorAll("[data-diet]").forEach(i=>S.plan.diet[i.dataset.diet]=i.value.trim());save();toast("Planın kaydedildi ✓");render();break;
    case "copyYesterday":{e.preventDefault();const m=el.dataset.meal,ys=yesterdayMeal(m);if(!ys.length)break;addFoods(ys,m);TAB="today";render();toast(`Dünkü öğün eklendi: ${ys.length} kalem ✓`);break;}
    case "quickFood":{const f=quickList[+el.dataset.qi];if(!f)break;addFoods([f],addMeal);render();toast(f.name+" eklendi ✓");break;}
    case "favQuick":{const f=quickList[+el.dataset.qi];if(f){toggleFav(f);render();}break;}
    case "favFood":{const f=day().foods.find(x=>x.id===el.dataset.id);if(f){toggleFav(f);render();}break;}
    case "scanStart":startScan();break;
    case "bcLookup":lookupBarcode(document.getElementById("bcIn")?.value);break;
    case "bcAdd":{const g=+document.getElementById("bcG").value;if(!(g>0&&g<=5000))return toast("Geçerli bir miktar gir");const b=bcProd,k=g/100;
      pending.push({name:b.name+(b.brand?" ("+b.brand+")":""),amount:g+" g",kcal:r0(b.kcal*k),p:+(b.p*k).toFixed(1),c:+(b.c*k).toFixed(1),f:+(b.f*k).toFixed(1)});
      bcProd=null;bcCode="";render();toast("Aşağıdan onayla");break;}
    case "wPt":{const w=wPts[+el.dataset.i],o=document.getElementById("wInfo");if(w&&o){o.textContent=`${fmtD(w.date)}: ${fmtKg(w.kg)} kg`;o.style.color="var(--ink)";}break;}
    case "delWeight":{const dt=+el.dataset.date;if(S.weights.length<=1)return toast("Son kaydı silemezsin");S.weights=S.weights.filter(w=>w.date!==dt);
      const l=S.weights.slice().sort((a,b)=>a.date-b.date).pop();if(l)S.profile.weight=l.kg;save();render();toast("Kilo kaydı silindi");break;}
    case "toggleMealRem":S.settings.mealRem.on=!S.settings.mealRem.on;save();render();break;
    case "getSugg":getSugg();break;
    case "addSugg":{const s=suggs[+el.dataset.i];const d=day();d.foods.push({id:uid(),meal:addMeal,name:s.name,amount:"",kcal:s.kcal,p:s.p,c:s.c,f:s.f,t:Date.now()});save();toast("Eklendi ✓");break;}
    case "logWeight":{const v=+document.getElementById("wIn").value;if(!(v>=30&&v<=300))return toast("Geçerli bir kilo gir");S.weights.push({date:Date.now(),kg:v});S.profile.weight=v;save();render();toast("Kilo kaydedildi, hedefler güncellendi");break;}
    case "pushOn":enablePush();break;
    case "pushOff":disablePush();break;
    case "toggleRem":S.settings.reminders=!S.settings.reminders;save();render();
      break;
    case "remMin":S.settings.reminderMin=+el.dataset.m;save();render();break;
    case "glass":S.settings.glass=+el.dataset.m;save();render();break;
    case "exportData":{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="kalori-yedek-"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();toast("Yedek indirildi ✓");break;}
    case "reset":if(Date.now()-resetArm<4000){if(S.settings.push)disablePush();S=defaultState();save();TAB="today";render();toast("Sıfırlandı");}else{resetArm=Date.now();toast("Emin misin? Silmek için tekrar dokun");}break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="searchIn"){viewAdd._q=t.value;document.getElementById("searchRes").innerHTML=searchHTML(t.value);}
  if(t.id==="foodText")viewAdd._txt=t.value;
  if(t.id==="bcIn")bcCode=t.value;
  if(t.id==="craving")viewSugg._c=t.value;
  if(t.dataset&&t.dataset.pi!==undefined){const f=pending[+t.dataset.pi];if(!f)return;const k=t.dataset.k;f[k]=(k==="name"||k==="amount")?t.value:+t.value;
    const sumEl=document.querySelector(".card .row.between b");}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="photoIn"&&t.files&&t.files[0]){try{photoBlob=await resizeImage(t.files[0]);photoURL=URL.createObjectURL(photoBlob);showPreview();}catch(err){toast("Fotoğraf okunamadı");}}
  if(t.id==="importIn"&&t.files&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!j||typeof j!=="object"||!("days" in j))throw 0;S=normalizeState(j);save();TAB="today";render();toast("Yedek yüklendi ✓");}catch(err){toast("Yedek dosyası okunamadı");}}
  if(t.dataset&&t.dataset.mealtime){S.settings.mealRem.t[t.dataset.mealtime]=/^\d{2}:\d{2}$/.test(t.value)?t.value:"";save();}
  if(t.id==="wakeS"||t.id==="wakeE"){S.settings.wakeStart=+document.getElementById("wakeS").value;S.settings.wakeEnd=+document.getElementById("wakeE").value;save();}
  if(t.dataset&&t.dataset.pi!==undefined){render();showPreview();}
});

/* ============ Su hatırlatıcı (uygulama açıkken) ============ */
let lastRemind=Date.now();
function checkReminder(){
  const st=S.settings;if(!S.profile||!st.reminders)return;
  const h=new Date().getHours();if(h<st.wakeStart||h>=st.wakeEnd)return;
  const d=day(),T=targets();if(d.water>=T.water)return;
  if(Date.now()-lastRemind>=st.reminderMin*60000){
    lastRemind=Date.now();
    document.getElementById("remindTxt").textContent=`Bugün ${(d.water/1000).toFixed(1)} L içtin, hedefin ${(T.water/1000).toFixed(1)} L.`;
    document.getElementById("remind").classList.add("show");
    try{if(!S.settings.push&&document.hidden&&"Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker){navigator.serviceWorker.ready.then(r=>r.showNotification("💧 Su içme zamanı!",{body:document.getElementById("remindTxt").textContent,icon:"icon-192.png",tag:"water"}));}}catch(e){}
    try{navigator.vibrate&&navigator.vibrate([120,80,120]);}catch(e){}
  }
}
document.getElementById("remindAdd").onclick=()=>{const d=day();d.water+=S.settings.glass;save();document.getElementById("remind").classList.remove("show");render();toast("+"+S.settings.glass+" ml 💧");};
document.getElementById("remindLater").onclick=()=>{document.getElementById("remind").classList.remove("show");lastRemind=Date.now()-Math.max(0,S.settings.reminderMin-15)*60000;};
/* ---- Öğün hatırlatıcı (uygulama açıkken; kapalıyken Worker bildirim gönderir) ---- */
const mealShown=new Set();let mealBannerMeal="";
function checkMealReminder(){
  if(!S.profile||!S.settings.mealRem.on||document.hidden)return;
  const now=new Date(),mins=now.getHours()*60+now.getMinutes(),k=todayKey(),bits=mealBitsToday();
  MEALS.forEach(([mk,l],i)=>{const t=hmToMin(S.settings.mealRem.t[mk]);const id=k+mk;
    if(t<0||mealShown.has(id)||bits&(1<<i))return;
    if(mins>=t&&mins<t+30){mealShown.add(id);mealBannerMeal=mk;
      document.getElementById("remindMealT").textContent=l.replace(/^(\S+)\s(.*)$/,"$1 $2")+" zamanı";
      document.getElementById("remindMeal").classList.add("show");try{navigator.vibrate&&navigator.vibrate(100);}catch(e){}}});
}
document.getElementById("remindMealAdd").onclick=()=>{document.getElementById("remindMeal").classList.remove("show");if(mealBannerMeal)addMeal=mealBannerMeal;setTab("add");};
document.getElementById("remindMealLater").onclick=()=>document.getElementById("remindMeal").classList.remove("show");
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();checkReminder();checkMealReminder();}});
setInterval(()=>{checkReminder();checkMealReminder();},30000);

/* ============ Başlat ============ */
loadLocal();render();
function addGlassFromNotification(){if(!S.profile)return;const d=day();d.water+=S.settings.glass;save();TAB="today";render();toast("+"+S.settings.glass+" ml 💧 eklendi");}
// Bildirimden gelen bağlantılar: #su-ekle → 1 bardak su; #ogun-ogle → Ekle sekmesi, o öğün seçili
function handleHash(h){
  if(h==="#su-ekle"){addGlassFromNotification();return true;}
  const m=/^#ogun-(kahvalti|ogle|aksam|ara)$/.exec(h||"");
  if(m&&S.profile){addMeal=m[1];document.getElementById("remindMeal").classList.remove("show");setTab("add");return true;}
  return false;
}
function checkWaterHash(){const h=location.hash;if(h==="#su-ekle"||/^#ogun-/.test(h)){history.replaceState(null,"",location.pathname+location.search);handleHash(h);}}
checkWaterHash();window.addEventListener("hashchange",checkWaterHash);
if("serviceWorker" in navigator){navigator.serviceWorker.addEventListener("message",e=>{if(!e.data)return;if(e.data.type==="add-water")addGlassFromNotification();if(e.data.type==="open")handleHash(e.data.hash);});}
setTimeout(checkMealReminder,1500);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if("serviceWorker" in navigator&&window.isSecureContext){navigator.serviceWorker.register("sw.js").catch(()=>{});}

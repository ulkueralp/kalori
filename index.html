<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalori">
<title>Kalori – Beslenme & Su Takibi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f5; --card:#ffffff; --ink:#15231c; --muted:#6b7a72; --line:#e3ebe6;
  --green:#10b981; --green-d:#059669; --green-l:#d1fae5;
  --blue:#3b82f6; --blue-l:#dbeafe; --orange:#f59e0b; --red:#ef4444; --purple:#8b5cf6;
  --radius:18px; --shadow:0 2px 10px rgba(20,40,30,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1512; --card:#18211c; --ink:#e8f0eb; --muted:#93a39a; --line:#26322b;
    --green-l:#11372a; --blue-l:#162a46; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.app{max-width:520px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
header.top h1{font-size:22px;margin:0;font-weight:800}
header.top .sub{color:var(--muted);font-size:13px}
.sync{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:4px 8px;border-radius:99px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:6px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11px}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:#fff;transition:transform .08s, opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--green-l);color:var(--green-d)}
.btn.blue{background:var(--blue)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* ring */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:28px;font-weight:800;line-height:1}
.stats{flex:1;display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;font-size:14px}
.stat b{font-weight:800}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro .lbl{font-size:12px;color:var(--muted);font-weight:700}
.macro .val{font-size:14px;font-weight:800;margin:2px 0 4px}
/* water */
.water{display:flex;align-items:center;gap:14px}
.glass{width:58px;height:84px;border:3px solid var(--blue);border-top-width:0;border-radius:0 0 14px 14px;position:relative;overflow:hidden;flex:none}
.glass i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#60a5fa,#2563eb);transition:height .5s}
.water .amt{font-size:24px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
/* food list */
.meal{margin-top:6px}
.meal-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;padding:8px 0 4px;border-top:1px dashed var(--line)}
.meal:first-child .meal-h{border-top:0}
.food{display:flex;align-items:center;gap:8px;padding:7px 0}
.food .n{flex:1;min-width:0}
.food .n div:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food .k{font-weight:800;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav.tabs button .ic{font-size:22px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--green-d)}
nav.tabs button.on .ic{filter:none;opacity:1}
nav.tabs button.add .ic{background:var(--green);color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 14px rgba(16,185,129,.4);filter:none;opacity:1;font-size:26px}
/* misc */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;padding:9px;border-radius:10px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.res-item{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.res-item .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.res-item .grid4 input{padding:7px 6px;font-size:14px;text-align:center}
.res-item .grid4 span{font-size:10px;color:var(--muted);display:block;text-align:center;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:12px;cursor:pointer}
.day.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-l)}
.day .d{font-weight:800;font-size:15px}
.day .m{font-size:14px;min-height:18px}
.hist{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hist .col i{width:100%;border-radius:8px 8px 4px 4px;background:var(--green);min-height:2px}
.hist .col i.over{background:var(--orange)}
.hist .col span{font-size:10px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#15231c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.remind{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:500px;margin:0 auto;background:var(--blue);color:#fff;border-radius:16px;padding:14px;z-index:60;box-shadow:0 10px 30px rgba(37,99,235,.35);display:none;animation:drop .35s ease}
.remind.show{display:block}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.remind .btn{background:#fff;color:var(--blue)}
.remind .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.sugg{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.sugg .t{font-weight:800}
.photo-prev{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:10px;display:none}
.hide{display:none!important}
.search-res .food{cursor:pointer;border-bottom:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--green-l);color:var(--green-d)}
.hero{text-align:center;padding:10px 4px 4px}
.hero .em{font-size:52px}
.hero h2{justify-content:center;font-size:22px}
.note{background:var(--green-l);color:var(--green-d);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.warn{background:#fef3c7;color:#92400e}
.star{border:0;background:transparent;font-size:18px;cursor:pointer;padding:4px 4px;color:var(--muted);line-height:1}
.star.on{color:var(--orange)}
.qlist .food{border-bottom:1px solid var(--line)}
.qlist .food:last-child{border-bottom:0}
.qlist .food .n{cursor:pointer}
.chart{width:100%;height:auto;display:block;margin-top:8px;touch-action:manipulation}
.chart text{font-family:inherit;font-size:10px;fill:var(--muted);font-weight:700}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.wk .tiny{margin-bottom:1px}
.tips{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.tips li{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.prod{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.scanner{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-box{position:relative;width:78%;max-width:340px;height:150px;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scan-tip{position:relative;color:#fff;margin-top:14px;font-weight:700;text-align:center;padding:0 16px}
/* selamlama, puan */
.motiv{margin:-4px 2px 12px;font-size:13.5px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:12px;padding:8px 12px}
.ptchip{font:inherit;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap;flex:none;padding:6px 10px}
.ptpop{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:95;background:var(--green-d);color:#fff;font-weight:800;border-radius:99px;padding:6px 12px;pointer-events:none;animation:ptp 1.6s ease forwards}
@keyframes ptp{0%{transform:translateY(10px) scale(.7);opacity:0}15%{transform:none;opacity:1}75%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
/* renk temaları (puanla açılır) */
:root[data-accent=ocean]{--green:#0284c7;--green-d:#075985;--green-l:#e0f2fe}
:root[data-accent=lavender]{--green:#7c3aed;--green-d:#5b21b6;--green-l:#ede9fe}
:root[data-accent=rose]{--green:#db2777;--green-d:#9d174d;--green-l:#fce7f3}
:root[data-accent=graphite]{--green:#475569;--green-d:#1e293b;--green-l:#e2e8f0}
@media (prefers-color-scheme: dark){
  :root[data-accent=ocean]{--green-d:#38bdf8;--green-l:#0c2f44}
  :root[data-accent=lavender]{--green-d:#a78bfa;--green-l:#2a1f47}
  :root[data-accent=rose]{--green-d:#f472b6;--green-l:#43172f}
  :root[data-accent=graphite]{--green:#64748b;--green-d:#cbd5e1;--green-l:#1e293b}
}
/* ilerleme */
.prog-hero{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border-radius:16px;padding:16px;text-align:center}
.prog-hero .now{font-size:40px;font-weight:800;line-height:1.05}
.prog-hero .row{justify-content:space-between;margin-top:12px;text-align:left}
.prog-hero .row>div:last-child{text-align:right}
.prog-hero .lbl{font-size:12px;opacity:.85;font-weight:700}
.prog-hero .v{font-size:17px;font-weight:800;background:rgba(255,255,255,.18);border-radius:10px;padding:3px 10px;display:inline-block;margin-top:3px}
.streak{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.streak .ic{font-size:22px;line-height:1}
/* rozetler */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-top:6px}
.badge{border:0;background:transparent;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0}
.badge .b{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--green-l);border:2px solid var(--green)}
.badge.off .b{background:var(--bg);border:2px dashed var(--line);filter:grayscale(1);opacity:.45}
.badge span{font-size:10.5px;font-weight:700;text-align:center;line-height:1.2}
.badge.off span{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fade .2s}
.modal .box{background:var(--card);color:var(--ink);border-radius:22px;padding:22px 18px 16px;width:100%;max-width:440px;text-align:center;margin-bottom:env(safe-area-inset-bottom);animation:up .3s ease}
.modal .big{font-size:64px;line-height:1;margin:6px 0 8px;display:inline-block;animation:pop .6s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
/* fotoğraf etiketleri */
.photo-wrap{position:relative;width:fit-content;max-width:100%;margin:10px auto 0}
.photo-wrap img{display:block;max-width:100%;max-height:380px;border-radius:14px}
.ptag{position:absolute;transform:translate(-50%,-50%);background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:5px 9px;font:inherit;font-size:12px;font-weight:800;line-height:1.2;box-shadow:0 3px 12px rgba(0,0,0,.25);cursor:pointer;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag b{color:var(--green-d);font-size:11px;display:block}
.res-item.hl{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
/* ses */
.btn.rec{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(239,68,68,.15)}}
.scanner .btn{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));color:#fff;border-color:rgba(255,255,255,.6)}
</style>
</head>

  for(let i=0;i<7;i++){const v=s.plan.sportItems[i];s.plan.sportItems[i]=Array.isArray(v)?v.filter(x=>x&&x.key):(v&&v.key?[v]:[]);}if(!Array.isArray(s.favs))s.favs=[];if(!Array.isArray(s.weights))s.weights=[];if(!Array.isArray(s.measures))s.measures=[];

function targets(){
  const p=S.profile; if(!p) return null;
  const w=+p.weight,h=+p.height,a=+p.age;
  const bmr=10*w+6.25*h-5*a+(p.sex==="m"?5:-161);
  const tdee=bmr*(+p.activity||1.2);
  const g=GOALS.find(x=>x[0]===p.goal)||GOALS[1];
  const floor=p.sex==="m"?1500:1200;
  let kcal=Math.round((tdee+g[2])/10)*10;
  let floored=false; if(kcal<floor){kcal=floor;floored=true;}
  const protein=Math.round(w*(p.goal==="keep"?1.2:1.6));
  const fat=Math.round(kcal*0.28/9);
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  const water=Math.round(w*33/100)*100;
  const bmi=w/((h/100)**2);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,protein,fat,carbs,water,bmi,floored};
}

// Yazıdan antrenman tanıma: "45 dk tempolu yürüyüş, yarım saat ağırlık" (yapay zekâ gerekmez)
function parseWorkouts(txt){
  const items=[],missed=[];
  String(txt||"").replace(/(\d),(\d)/g,"$1.$2").split(/[,;\n+]|\s+ve\s+|\s+sonra\s+/i).map(s=>s.trim()).filter(Boolean).forEach(part=>{
    const n=" "+normTR(part)+" ",tk=n.split(/[^a-z0-9]+/).filter(Boolean);
    const sp=SPORTS.find(s=>s.roots.some(r=>r.includes(" ")?n.includes(" "+r):r.length<3?tk.includes(r):tk.some(t=>t.startsWith(r))));
    if(!sp){missed.push(part);return;}
    let min=0,m;
    if((m=n.match(/(\d+(?:[.,]\d+)?)\s*(dk|dakika|dak|min)/)))min=parseFloat(m[1].replace(",","."));
    else if((m=n.match(/(\d+(?:[.,]\d+)?)\s*(saat|sa)\b/)))min=parseFloat(m[1].replace(",","."))*60;
    else if(/\bbir bucuk saat/.test(n))min=90;else if(/\byarim saat/.test(n))min=30;else if(/\bbir saat/.test(n))min=60;else if(/\bceyrek/.test(n))min=15;
    const int=/(hafif|yavas|rahat|sakin|keyfi)/.test(n)?0:/(tempolu|hizli|yogun|agir tempo|sert|zorlu|power|mac\b)/.test(n)?2:1;
    items.push({w:makeWorkout(sp.key,int,min||30),guessed:!min});
  });
  return {items,missed};
}

const API_URL = "https://kalori-ai.ulkueralp20.workers.dev/";
const API_BASE = API_URL.replace(/\/+$/,"");

function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b);});}
async function askJSON(prompt,opts={}){
  if(!AI) throw new Error("no-ai");
  const body={prompt};
  if(opts.images&&opts.images[0]){body.image={mime:opts.images[0].type||"image/jpeg",data:await blobToB64(opts.images[0])};}
  if(opts.audio){body.audio={mime:opts.audio.type||"audio/wav",data:await blobToB64(opts.audio)};}
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),60000);
  let r;
  try{r=await fetch(API_BASE+"/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});}
  catch(err){const e=new Error("net");e.code=err&&err.name==="AbortError"?"timeout":(navigator.onLine===false?"offline":"network");throw e;}
  finally{clearTimeout(tm);}
  if(r.status===429){const e=new Error("rate");e.code="rate_limited";throw e;}
  if(r.status===503||r.status===502||r.status===504||r.status===524){const e=new Error("busy");e.code="busy";throw e;}
  if(r.status===403){const e=new Error("origin");e.code="origin";throw e;}
  if(!r.ok){const e=new Error("http "+r.status);e.code="http";e.status=r.status;throw e;}
  const j=await r.json();
  let val=j.text??j;
  if(typeof val==="string"){const m=val.match(/\{[\s\S]*\}/);val=JSON.parse(m?m[0]:val);}
  return val;
}

// Bildirimi Cloudflare Worker gönderir; uygulama kapalı, ekran kilitliyken de gelir.
// iPhone'da yalnızca ana ekrana eklenmiş uygulamada çalışır (iOS 16.4+).
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function pushState(){
  if(!API_BASE) return "noapi";
  if(!("serviceWorker" in navigator)||!window.isSecureContext) return "unsupported";
  if(isIOS()&&!isStandalone()) return "ios-install";
  if(!("PushManager" in window)||!("Notification" in window)) return "unsupported";
  if(Notification.permission==="denied") return "denied";
  return S.settings.push?"on":"off";
}
async function api(path,body){const r=await fetch(API_BASE+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error("http "+r.status);return r.json();}
function b64uToU8(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const b=atob(s+"===".slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0));}
const hmToMin=s=>{const m=/^(\d{2}):(\d{2})$/.exec(s||"");return m?(+m[1])*60+(+m[2]):-1;};
const mealMins=()=>MEALS.map(([k])=>hmToMin(S.settings.mealRem.t[k]));
function mealBitsToday(){const d=S.days[todayKey()];if(!d)return 0;return MEALS.reduce((b,[k],i)=>b|(d.foods.some(f=>f.meal===k)?1<<i:0),0);}
function pushPayload(sub){const T=targets();return {subscription:sub,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Istanbul",interval:S.settings.reminderMin,start:S.settings.wakeStart,end:S.settings.wakeEnd,goal:T?T.water:2000,enabled:S.settings.reminders,mealsOn:S.settings.mealRem.on,meals:mealMins(),weekly:S.settings.weeklyOn!==false};}
function pushSigNow(){const T=targets();return JSON.stringify([S.settings.reminders,S.settings.reminderMin,S.settings.wakeStart,S.settings.wakeEnd,T&&T.water,S.settings.mealRem.on,mealMins(),S.settings.weeklyOn!==false]);}
async function enablePush(){
  let st=pushState(); if(st!=="off"&&st!=="on") return render();
  pushBusy=true;render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Bildirim izni verilmedi");return;}
    const reg=await navigator.serviceWorker.ready;
    const {publicKey}=await api("/push/key");
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(publicKey)});
    const js=sub.toJSON();
    await api("/push/subscribe",pushPayload(js));
    S.settings.push=true;S.settings.pushEndpoint=js.endpoint;S.settings.pushSig=pushSigNow();S.settings.reminders=true;save();
    toast("Bildirimler açıldı ✓");
    api("/push/test",{endpoint:js.endpoint}).catch(()=>{});
  }catch(e){toast("Bildirimler açılamadı, tekrar dene");}
  finally{pushBusy=false;render();}
}
async function disablePush(){
  const ep=S.settings.pushEndpoint;
  pushBusy=true;render();
  try{if(ep) await api("/push/unsubscribe",{endpoint:ep}).catch(()=>{});
    const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(sub) await sub.unsubscribe().catch(()=>{});}catch(e){}
  S.settings.push=false;S.settings.pushEndpoint="";save();pushBusy=false;render();toast("Telefon bildirimleri kapatıldı");
}
let pushBusy=false, pushSyncT=null;
// Ayarlar ya da su hedefi değişince sunucuyu güncelle; hedef tamamlanınca o gün bildirimi durdur
function pushAfterSave(){
  if(!S.settings.push||!S.settings.pushEndpoint||!API_BASE) return;
  const T=targets(); if(!T) return;
  if(pushSigNow()!==S.settings.pushSig){
    clearTimeout(pushSyncT);
    pushSyncT=setTimeout(async()=>{try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
      if(!sub){S.settings.push=false;saveLocal();return render();}
      await api("/push/subscribe",pushPayload(sub.toJSON()));S.settings.pushSig=pushSigNow();S.settings.pushEndpoint=sub.endpoint;saveLocal();}catch(e){}},1500);
  }
  const k=todayKey(),done=(S.days[k]&&S.days[k].water>=T.water)?k:"";
  if(done!==(S.settings.pushDone||"")){S.settings.pushDone=done;saveLocal();api("/push/done",{endpoint:S.settings.pushEndpoint,date:done}).catch(()=>{});}
  // Öğün hatırlatması: bugün hangi öğünlere bir şey eklendiğini sunucuya bildir (o öğün için bildirim gitmesin)
  if(S.settings.mealRem.on){const bits=mealBitsToday(),md=k+":"+bits;
    if(md!==(S.settings.pushMealDone||"")){S.settings.pushMealDone=md;saveLocal();if(bits)api("/push/meal",{endpoint:S.settings.pushEndpoint,date:k,bits}).catch(()=>{});}}
}

// Girilen verilere göre motive edici mesaj: duruma uyan adaylar toplanır, saat başı biri seçilir (ekran her açılışta zıplamasın)
function motivation(){
  const {h}=trNow(),T=targets(),d=day(),t=totals(),k=todayKey(),msgs=[];
  const goal=dayTarget(),left=Math.round(goal-t.kcal),burn=dayBurn(),wPct=d.water/T.water,ls=logStreak();
  const pend=pendingPlan(),pi=pend[0],psp=pi&&sportByKey(pi.key),planDone=!pi;
  const ws=S.weights.slice().sort((a,b)=>a.date-b.date),moved=ws.length>=2?ws[ws.length-1].kg-ws[0].kg:0;
  const lv=levelOf(pointsTotal());
  if(h>=0&&h<5)return "😴 Geç oldu; iyi bir uyku da hedeflerinin parçası.";
  if(!d.foods.length&&h<11)msgs.push("🍳 Güne kahvaltını kaydederek başla!");
  if(!d.foods.length&&h>=11)msgs.push("🍽️ Bugün henüz bir şey kaydetmedin; ilk öğünü eklemek 5 puan!");
  if(ls>=2)msgs.push(`🔥 ${ls} günlük kayıt serin var, bugün de bozma!`);
  if(d.foods.length&&left>150&&h>=12)msgs.push(`🎯 Bugünkü hedefine ${left} kcal kaldı; dengeli bir öğünle tamamla.`);
  if(d.foods.length&&left<=150&&left>=-goal*.1)msgs.push("✅ Kalori hedefine çok yaklaştın, süper gidiyorsun!");
  if(wPct>=1)msgs.push("💧 Su hedefin tamam, harika!");
  else if(h>=13&&wPct<.5)msgs.push(`💧 Suyun ${(d.water/1000).toFixed(1).replace(".",",")} L; bir bardak şimdi iyi gelir.`);
  if(burn)msgs.push(`💪 Bugün antrenmanla ${burn} kcal yaktın, tebrikler!`);
  else if(psp&&!planDone&&h<21)msgs.push(`🏃 Bugünkü planın: ${psp.name} ${pi.min} dk. Hadi!`);
  if(T&&d.foods.length&&h>=17&&t.p<T.protein*.7)msgs.push(`🥚 Protein hedefine ${Math.round(T.protein-t.p)} g kaldı.`);
  if(moved<=-1&&S.profile.goal!=="gain")msgs.push(`⚖️ Şimdiye kadar ${fmtKg(-moved)} kg verdin, emeğine sağlık!`);
  if(moved>=1&&S.profile.goal==="gain")msgs.push(`⚖️ Şimdiye kadar ${fmtKg(moved)} kg aldın, hedefe ilerliyorsun!`);
  if(lv.next-lv.pts<=60)msgs.push(`⭐ ${lv.n+1}. seviyeye sadece ${lv.next-lv.pts} puan kaldı!`);
  if(h>=21)msgs.push("🌙 Günü kapatmadan yediklerini ve suyunu kontrol et.");
  const sh=sleepHours(d.sleep),[smn]=sleepRange(),adv=sleepAdvice();
  if(sh&&sh<smn)msgs.push(`😴 Dün gece ${fmtDur(sh)} uyudun; bu gece saat ${adv.bed} gibi yatmayı dene.`);
  if(sh&&sleepOk(sh)&&h<12)msgs.push(`😴 ${fmtDur(sh)} uyku, harika bir başlangıç!`);
  if(h>=20)msgs.push(`🌙 Bu gece saat ${adv.bed} gibi yatarsan ${fmtDur(adv.target)} uyursun.`);
  const stp=+d.steps||0,sg=stepGoal();
  if(!stp&&h>=17)msgs.push("👣 Bugünkü adımlarını girmeyi unutma.");
  if(stp&&stp<sg&&h>=12&&h<21)msgs.push(`👣 Adım hedefine ${fmtN(sg-stp)} kaldı; ${Math.ceil((sg-stp)/100)} dk yürüyüş yeter.`);
  if(stp>=sg)msgs.push(`👣 ${fmtN(stp)} adım, hedef tamam!`);
  if(!msgs.length)msgs.push("🌱 Küçük adımlar büyük farklar yaratır. Bugün de buradasın!");
  const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
  return msgs[(doy*24+h)%msgs.length];
}

function ring(pct,color,size=132,stroke=12){
  const r=(size-stroke)/2,c=2*Math.PI*r,o=c*(1-Math.min(1,pct));
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--line)" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" style="transition:stroke-dashoffset .6s"/></svg>`;
}

/* ---- Adımlar ----
   Web uygulamaları telefonun adım sayarına (Apple Sağlık / Health Connect) erişemez; kullanıcı sayıyı yazar ya da yapıştırır.
   Hedef: son 7 günün ortalamasına göre kademeli (+1000, 6.000–10.000 arası; zaten 10.000+ ise korunur). Elle de belirlenebilir.
   Adımla yakılan kalori bilgi amaçlıdır: günlük yürüme, profildeki hareket seviyesinde zaten var; yeme hakkına eklenmez. */
const STEP_MIN=5000;
const fmtN=n=>Math.round(n).toLocaleString("tr-TR");
const r500=x=>Math.round(x/500)*500;
function stepGoal(){
  if(S.settings.stepGoal>0)return S.settings.stepGoal;
  const v=[];for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()-i);const x=S.days[keyOf(d)];if(x&&x.steps>0)v.push(x.steps);}
  if(v.length>=3){const avg=v.reduce((a,b)=>a+b,0)/v.length;return avg>=10000?Math.min(15000,r500(avg)):Math.min(10000,Math.max(6000,r500(avg+1000)));}
  const a=+S.profile.activity;return a<1.3?6000:a<1.5?7000:a<1.7?8000:10000;
}
// "8.500", "8500 adım" ya da "8,500" → 8500. O günün hedefi puan için kayda yazılır.
function setSteps(raw){
  const n=parseInt(String(raw||"").replace(/[^\d]/g,""),10);
  if(!(n>=0&&n<=100000))return toast("Adım sayısını rakamla yaz (örn. 8500)");
  const d=day(),goal=stepGoal();d.steps=n;d.stepGoal=goal;save();render();
  toast(n>=goal?`👣 ${fmtN(n)} adım · hedef tamam 🎉`:`👣 ${fmtN(n)} adım kaydedildi`);
}
function stepLevel(n){return n<STEP_MIN?"Hareketsiz gün":n<7500?"Az hareketli":n<10000?"Orta derecede aktif":"Aktif 👏";}
const stepKcal=n=>Math.round(n*(+S.profile.weight||70)*0.0005);
const stepKm=n=>(n*(+S.profile.height||165)*0.415/100000).toFixed(1).replace(".",",");
const canClip=()=>!!(navigator.clipboard&&navigator.clipboard.readText);
function stepCardHTML(d){
  const st=+d.steps||0,goal=stepGoal(),pct=Math.min(100,st/goal*100),rem=goal-st,h=trNow().h;
  let msg;
  if(!st)msg=`📱 Telefonundaki Sağlık (iPhone) ya da Fit / Samsung Health (Android) uygulamasında görünen bugünkü adım sayını yaz.`;
  else if(rem>0)msg=`Hedefe <b>${fmtN(rem)}</b> adım kaldı: yaklaşık <b>${Math.ceil(rem/100)} dk</b> tempolu yürüyüş.${st<STEP_MIN&&h>=16?` Sağlık için günde en az ${fmtN(STEP_MIN)} adım önerilir.`:""}`;
  else msg="🎉 Bugünkü adım hedefin tamam!";
  return `<div class="card" id="stepCard"><div class="row between"><h2 style="margin:0">👣 Adımlar</h2><span class="pill">Hedef ${fmtN(goal)}</span></div>
    <div style="margin-top:8px"><span style="font-size:24px;font-weight:800">${fmtN(st)}</span> <span class="small muted">/ ${fmtN(goal)} adım</span></div>
    <div class="bar" style="margin-top:6px;height:10px"><i style="width:${pct.toFixed(1)}%;background:${st>=goal?"var(--green)":st<STEP_MIN?"var(--orange)":"var(--blue)"}"></i></div>
    ${st?`<div class="small muted" style="margin-top:6px">${stepLevel(st)} · ≈${stepKm(st)} km · ≈${stepKcal(st)} kcal</div>`:""}
    <p class="small" style="margin:8px 0 0">${msg}</p>
    <div class="row" style="margin-top:10px;gap:6px"><input id="stepIn" inputmode="numeric" placeholder="${st?"Güncelle: "+fmtN(st):"Bugünkü adım sayın"}" style="flex:1;min-width:0">
      <button class="btn" data-act="stepSave">Kaydet</button>${canClip()?`<button class="btn ghost" data-act="stepPaste" title="Kopyaladığın sayıyı yapıştır" aria-label="Panodan yapıştır">📋</button>`:""}</div>
    <details style="margin-top:10px"><summary class="tiny muted" style="cursor:pointer">Hedef nasıl belirleniyor? Neden otomatik gelmiyor?</summary>
      <p class="tiny muted" style="margin:6px 0">• Sağlık için günde en az ${fmtN(STEP_MIN)}, ideal 7.000–10.000 adım önerilir. Hedefin son 7 günün ortalamana göre her hafta kademeli olarak (+1.000) artar.<br>
      • Adımla yakılan kalori bilgi amaçlıdır; günlük yürümen profildeki hareket seviyende zaten hesaba katıldığı için yeme hakkına eklenmez.<br>
      • Web uygulamaları telefonun adım sayarını okuyamaz (Apple ve Google izin vermiyor). Otomatik okuma, uygulama ileride mağaza uygulamasına çevrilince eklenebilir.</p>
      <div class="row" style="gap:6px"><input id="stepGoalIn" inputmode="numeric" placeholder="${S.settings.stepGoal?"Hedefim: "+fmtN(S.settings.stepGoal):"Kendi hedefin (boş = otomatik)"}" style="flex:1;min-width:0"><button class="btn sm ghost" data-act="stepGoalSave">Hedefi kaydet</button></div></details>
  </div>`;
}

/* ---- Uyku ----
   Önerilen süre (ABD Ulusal Uyku Vakfı / AASM): 13 yaş 9–11 sa, 14–17 yaş 8–10 sa, 18–64 yaş 7–9 sa, 65+ 7–8 sa.
   O gün yoğun spor yapıldıysa (≥400 kcal, ≥60 dk ya da 30+ dk yoğun) toparlanma için alt sınır ve hedef yarım saat artar.
   Kayıt, uyanılan güne yazılır: day.sleep = {bed:"23:30", wake:"07:00", q:1–5}. */
let sleepEdit=false,sleepQ=0;
function sleepRange(){const a=+S.profile.age;return a<14?[9,11,10]:a<18?[8,10,9]:a<65?[7,9,8]:[7,8,7.5];}
const hmMin=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||"");return m?(+m[1])*60+(+m[2]):null;};
const minHM=m=>pad(Math.floor(((m%1440)+1440)%1440/60))+":"+pad(((m%60)+60)%60);
function sleepHours(sl){if(!sl)return 0;const b=hmMin(sl.bed),w=hmMin(sl.wake);if(b===null||w===null)return 0;const m=(w-b+1440)%1440;return m>0&&m<=16*60?m/60:0;}
const fmtDur=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)} sa${m%60?` ${m%60} dk`:""}`;};
function hardDay(k){const ws=workoutsOf(k);return ws.reduce((a,w)=>a+w.kcal,0)>=400||ws.reduce((a,w)=>a+w.min,0)>=60||ws.some(w=>w.int===2&&w.min>=30);}
function lastSleep(){for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);const x=S.days[keyOf(d)];if(x&&x.sleep&&sleepHours(x.sleep))return x.sleep;}return null;}
function sleepAdvice(k=todayKey()){
  const [mn,mx,ideal]=sleepRange(),hard=hardDay(k),min=hard?Math.min(mx,mn+.5):mn,target=hard?Math.min(mx,ideal+.5):ideal;
  const ls=lastSleep(),wake=ls?ls.wake:`${pad(S.settings.wakeStart||7)}:00`;
  return {min,max:mx,target,hard,wake,bed:minHM(hmMin(wake)-Math.round(target*60)-15)}; // uykuya dalmak için 15 dk pay
}
const sleepOk=h=>{const [mn,mx]=sleepRange();return h>=mn&&h<=mx;};
const Q_EMO=["😫","😕","😐","🙂","😴"];
function sleepCardHTML(d){
  const sl=d.sleep,h=sleepHours(sl),[mn,mx]=sleepRange(),adv=sleepAdvice(),ls=lastSleep();
  let top;
  if(h&&!sleepEdit){
    const st=h<mn?["Az","var(--orange)"]:h>mx+1?["Fazla","var(--orange)"]:h>mx?["Biraz fazla","var(--blue)"]:["Sağlıklı ✓","var(--green-d)"];
    top=`<div class="row between" style="margin-top:6px"><div><div style="font-size:24px;font-weight:800">${fmtDur(h)}</div>
      <div class="small muted">Dün gece · ${esc(sl.bed)} → ${esc(sl.wake)}${sl.q?" · "+Q_EMO[sl.q-1]:""}</div></div>
      <div style="text-align:right"><span class="pill" style="background:var(--bg);color:${st[1]}">${st[0]}</span><div><a href="#" data-act="sleepEdit" class="tiny" style="color:var(--muted)">düzenle</a></div></div></div>
      ${h<mn?`<p class="small" style="margin:8px 0 0">Önerilenin (${mn}–${mx} sa) altında kaldın. Az uyku iştahı artırıp kilo vermeyi zorlaştırabilir; bu gece biraz erken yatmayı dene.</p>`:""}
      ${h>mx+1?`<p class="small" style="margin:8px 0 0">Önerilenden (${mn}–${mx} sa) uzun uyudun. Sık oluyorsa ve hâlâ yorgun hissediyorsan bir hekime danışmanı öneririm.</p>`:""}`;
  }else{
    const bedDef=(sl&&sl.bed)||(ls&&ls.bed)||"23:00",wakeDef=(sl&&sl.wake)||adv.wake;if(!sleepQ&&sl&&sl.q)sleepQ=sl.q;
    top=`<p class="small muted" style="margin:0 0 4px">Dün gece ne zaman yattın, bu sabah ne zaman kalktın?</p>
      <div class="grid2"><div><label class="f">Yattığın saat</label><input type="time" id="slBed" value="${esc(bedDef)}"></div><div><label class="f">Kalktığın saat</label><input type="time" id="slWake" value="${esc(wakeDef)}"></div></div>
      <label class="f">Nasıl uyudun? (isteğe bağlı)</label>
      <div class="chips">${Q_EMO.map((e,i)=>`<button class="chip ${sleepQ===i+1?"on":""}" data-act="slQ" data-q="${i+1}" style="font-size:18px;padding:5px 11px">${e}</button>`).join("")}</div>
      <button class="btn full" style="margin-top:10px" data-act="sleepSave">Kaydet</button>`;
  }
  // Son 7 gecenin ortalaması
  const hs=[];for(let i=0;i<7;i++){const x=new Date();x.setDate(x.getDate()-i);const y=S.days[keyOf(x)];const v=y&&sleepHours(y.sleep);if(v)hs.push(v);}
  const avg=hs.length>=3?hs.reduce((a,b)=>a+b,0)/hs.length:0;
  return `<div class="card" id="sleepCard"><div class="row between"><h2 style="margin:0">😴 Uyku</h2><span class="pill">Önerilen ${mn}–${mx} sa</span></div>
    ${top}
    <div class="note" style="margin-top:10px">🌙 Bu gece için öneri: <b>${fmtDur(adv.target)}</b> (en az ${fmtDur(adv.min)}, en çok ${mx} sa).
      ${adv.hard?"Bugün yoğun antrenman yaptığın için toparlanmak adına biraz daha uzun uyku öneriliyor. ":""}Kalkışın ${esc(adv.wake)} ise önerilen yatış saati: <b>${adv.bed}</b>.</div>
    ${avg?`<p class="tiny muted" style="margin:8px 0 0">Son ${hs.length} gece ortalaması: <b style="color:var(--ink)">${fmtDur(avg)}</b>${avg<mn?" · uyku borcu birikiyor":""}</p>`:""}
  </div>`;
}

/* ---- Bugünkü spor kartı + "Antrenman ekle" penceresi ---- */
const intLabel=w=>((sportByKey(w.key)||{}).lbl||INT_GENERIC)[w.int]||"";

      ${pw.length>1?`<button class="btn sm full" style="margin-top:6px" data-act="wkPlanAll">✓ Hepsini yaptım · ≈${pw.reduce((a,x)=>a+x.w.kcal,0)} kcal</button>`:""}`:""}
    ${psp&&!pw.length?`<div class="small" style="margin-top:8px;color:var(--green-d);font-weight:700">✅ Bugünkü planın tamam!</div>`:""}
    ${list?`<div style="margin-top:6px">${list}</div>`:""}
    ${burn?`<div class="note" style="margin-top:8px">🔥 Bugün antrenmanlarla <b>${burn} kcal</b> yaktın. Yarısı, <b>+${bonus} kcal</b>, yeme hakkına eklendi.</div>`:""}

    ${ws.length&&S.profile.activity>=1.55?`<p class="tiny muted" style="margin:8px 0 0">💡 Antrenmanlarını buraya kaydediyorsan profilinde hareket seviyeni "Az hareketli" seçmen önerilir; yoksa aynı spor iki kez sayılır.</p>`:""}
  </div>`;
}
let wk={cat:"kardiyo",key:"walk",int:1,min:30,text:"",msg:"",busy:false};
const wkKcalTxt=kc=>`🔥 Yaklaşık <b>${kc} kcal</b> yakarsın · yeme hakkına <b>+${Math.round(kc*EAT_BACK)} kcal</b> eklenir`;
function wkSheetHTML(){

// Önce yazıyı kendimiz tanırız (ücretsiz, anında); tanıyamazsak yapay zekâya sorarız
async function wkFromText(){

/* ---- Yerel tahmin: yapay zekâ çalışmazsa yazılanı yerel listeyle eşleştirir ---- */
const TR_ASCII={"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u"};
const normTR=s=>String(s||"").toLocaleLowerCase("tr").replace(/[çğıöşüâîû]/g,c=>TR_ASCII[c]);
const STOPW=new Set(["bucuk","adet","tane","dilim","porsiyon","bardak","kase","kasik","kasigi","fincan","avuc","paket","kutu","kupa","g","gr","gram","ml","lt","litre","kg","orta","buyuk","kucuk","biraz","bir","iki","uc","dort","bes","alti","yarim","ceyrek","tabak","kadeh","top","ile","ve","de","da","icin","sade","boy"]);
const NUMW={bir:1,iki:2,uc:3,dort:4,bes:5,alti:6,yedi:7,sekiz:8,dokuz:9,on:10,yarim:0.5,ceyrek:0.25};
const toks=s=>normTR(s).split(/[^a-z0-9]+/).filter(t=>t.length>=2&&!/^\d+$/.test(t)&&!STOPW.has(t));
let DB_IDX=null;
function dbIndex(){if(!DB_IDX)DB_IDX=FOOD_DB.map(f=>({f,main:toks(f.name.replace(/\(.*?\)/g," ")),par:toks((f.name.match(/\((.*?)\)/)||["",""])[1])}));return DB_IDX;}
// a: yazılan kelime, b: listedeki kelime. "corba"→"corbasi" (ek) güçlü, "salata"→"salatalik" (başka kelime) zayıf eşleşir.
function tokW(a,b){if(a===b)return 1;if(a.length>=3&&b.startsWith(a))return b.length-a.length>=3?.4:.7;if(b.length>=3&&a.startsWith(b))return .7;if(a.length>=5&&b.length>=5&&a.slice(0,4)===b.slice(0,4))return .6;return 0;}
function bestDB(q){let best=null,bs=.45;
  for(const it of dbIndex()){let s=0;const used=new Set();
    for(const t of q){let w=0,hit=null;for(const d of [...it.main,...it.par]){const x=tokW(t,d);if(x>w){w=x;hit=d;}}if(w){s+=w;used.add(hit);}}
    if(!s)continue;s-=it.main.filter(d=>!used.has(d)).length*.5+it.par.filter(d=>!used.has(d)).length*.25;
    if(s>bs){bs=s;best=it.f;}}
  return best;}
function localEstimate(txt){
  const items=[],missed=[];
  String(txt||"").replace(/(\d),(\d)/g,"$1.$2").split(/[,;\n+]|\s+ve\s+|\s+ile\s+/i).map(s=>s.trim()).filter(Boolean).forEach(part=>{
    let n=normTR(part).replace(/\b(cay|tatli|yemek)\s+kasig\w*/g," kasik ");
    let mult=1,grams=0,given=false,m;
    if((m=n.match(/^\s*(\d+(?:[.,]\d+)?)\s*(g|gr|gram|ml)\b/))){grams=parseFloat(m[1].replace(",","."));}
    else if((m=n.match(/^\s*(\d+(?:[.,]\d+)?)/))){mult=parseFloat(m[1].replace(",","."));given=true;}
    else if((m=n.match(/^\s*([a-z]+)\b/))&&NUMW[m[1]]!==undefined){mult=NUMW[m[1]];given=true;if(m[1]==="bir"&&/^\s*bir\s+bucuk/.test(n))mult=1.5;}
    const q=toks(n); const f=q.length?bestDB(q):null;
    if(!f){missed.push(part);return;}
    let amount=f.amount;
    const fmtN=x=>String(x).replace(".",",");
    // Listedeki porsiyon birden fazla adetse ("5 adet" zeytin), yazılan sayı adet sayısıdır: "5 zeytin" = 1 porsiyon
    const cu=/^(\d+)\s+(adet|tane|dilim|kare|top)\b/.exec(f.amount);
    const userUnit=(n.match(/\b(adet|tane|dilim|kare|top|porsiyon|kase|tabak)\b/)||[])[1];
    const sameUnit=!userUnit||userUnit===cu?.[2]||(userUnit==="tane"&&cu?.[2]==="adet");
    if(grams){const unit=/^\s*[\d.,]+\s*ml\b/.test(n)?" ml":" g";const dg=(f.amount.match(/(\d+)\s*(g|ml)\b/)||[])[1];
      if(dg){mult=grams/+dg;amount=grams+unit;}else amount=f.amount+" (yazdığın: "+grams+unit+")";}
    else if(given&&cu&&+cu[1]>1&&sameUnit){amount=fmtN(mult)+" "+cu[2];mult=mult/+cu[1];}
    else if(mult!==1)amount=fmtN(mult)+" × "+f.amount;
    mult=Math.min(20,Math.max(.1,mult||1));
    items.push({name:f.name,amount,kcal:r0(f.kcal*mult),p:+(f.p*mult).toFixed(1),c:+(f.c*mult).toFixed(1),f:+(f.f*mult).toFixed(1)});
  });
  return {items,missed};
}
function applyLocal(txt,why){
  const r=localEstimate(txt); if(!r.items.length) return false;
  pending=pending.concat(r.items);
  aiNote=(why?why+" ":"")+"Bu yüzden yerel listeden tahmin ettim, değerleri kontrol et."+(r.missed.length?" Bulamadıklarım: "+r.missed.join(", ")+".":"");
  return true;
}
function normItems(items){return (items||[]).map(it=>{const o={name:String(it.name||"Yemek"),amount:String(it.amount||""),kcal:+it.kcal||0,p:+(+it.protein||+it.p||0).toFixed(1),c:+(+it.carbs||+it.c||0).toFixed(1),f:+(+it.fat||+it.f||0).toFixed(1)};
  const b=it.box||it.box_2d;if(Array.isArray(b)&&b.length===4&&b.every(n=>isFinite(+n)))o.box=b.map(n=>Math.max(0,Math.min(1000,+n)));return o;});}

async function startRecording(){

    const s=Math.floor((Date.now()-t0)/1000),el=document.getElementById("recT");if(el)el.textContent="0:"+String(s).padStart(2,"0");if(s>=30)voiceStop();},250)};

function voiceStop(send=true){

// 16 kHz mono 16 bit WAV: Gemini'nin desteklediği, her telefonda üretilebilen biçim (30 sn ≈ 1 MB)
function encodeWAV(chunks,rate,want=16000){
  const len=chunks.reduce((a,c)=>a+c.length,0),all=new Float32Array(len);let o=0;for(const c of chunks){all.set(c,o);o+=c.length;}
  const out=Math.min(want,rate),ratio=rate/out,n=Math.floor(len/ratio),pcm=new Int16Array(n);
  for(let i=0;i<n;i++){const s=Math.floor(i*ratio),e=Math.max(s+1,Math.min(len,Math.floor((i+1)*ratio)));let sum=0;for(let j=s;j<e;j++)sum+=all[j];
    const v=Math.max(-1,Math.min(1,sum/(e-s)));pcm[i]=v<0?v*0x8000:v*0x7fff;}
  const buf=new ArrayBuffer(44+n*2),dv=new DataView(buf),w=(p,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(p+i,s.charCodeAt(i));};
  w(0,"RIFF");dv.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,out,true);dv.setUint32(28,out*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,"data");dv.setUint32(40,n*2,true);
  new Int16Array(buf,44).set(pcm);
  return new Blob([buf],{type:"audio/wav"});
}

function fixTags(){
  const wrap=document.querySelector(".photo-wrap");if(!wrap)return;const img=wrap.querySelector("img");
  if(img&&!img.complete){img.onload=fixTags;return;}
  const H=wrap.clientHeight;if(!H)return;
  const tags=[...wrap.querySelectorAll(".ptag")],placed=[];
  for(const t of tags){let r=t.getBoundingClientRect();
    for(let guard=0;guard<8;guard++){const hit=placed.find(p=>r.left<p.right&&p.left<r.right&&r.top<p.bottom+3&&p.top<r.bottom+3);if(!hit)break;
      const top=parseFloat(t.style.top)+((hit.bottom+4-r.top)/H)*100;t.style.top=top+"%";r=t.getBoundingClientRect();}
    const over=r.bottom-wrap.getBoundingClientRect().bottom;if(over>0){t.style.top=(parseFloat(t.style.top)-over/H*100-1)+"%";r=t.getBoundingClientRect();}
    placed.push(r);}
}

// Yapay zekâ yoksa: "Kahvaltı:", "Öğle", "Akşam", "Ara öğün / Kuşluk / İkindi / Gece" başlıklarına göre böl
function dietLocalSplit(txt){
  const out={kahvalti:[],ogle:[],aksam:[],ara:[]};let cur=null;
  const head=[[/^(kahvalt|sabah)/,"kahvalti",""],[/^(ogle)/,"ogle",""],[/^(aksam)/,"aksam",""],[/^(kusluk)/,"ara","Kuşluk"],[/^(ikindi)/,"ara","İkindi"],[/^(gece)/,"ara","Gece"],[/^(ara)/,"ara",""]];
  for(let line of String(txt).split(/\n/)){line=line.trim();if(!line)continue;
    const n=normTR(line).replace(/^[^a-z]+/,"");const hm=head.find(([re])=>re.test(n));
    if(hm&&/^[^:]{0,22}(:|$)/.test(line.replace(/^[^\p{L}]+/u,""))){cur=hm[1];const rest=line.split(":").slice(1).join(":").trim();
      if(rest)out[cur].push((hm[2]?hm[2]+": ":"")+rest);else if(hm[2])out[cur].push(hm[2]+":");continue;}
    if(cur)out[cur].push(line.replace(/^[-•*·]\s*/,""));}
  const r={};for(const k in out)r[k]=out[k].join("\n");return r;
}

async function getSugg(){

  const craving=(document.getElementById("craving")?.value||"").trim(); viewSugg._c=craving;
  const ml=MEALS.find(m=>m[0]===addMeal)[1];
  if(!AI){ // yerel öneri
    const budget=addMeal==="ara"?Math.min(left,300):left*0.6;
    suggs=FOOD_DB.filter(f=>f.kcal<=Math.max(120,budget)&&f.kcal>40).sort(()=>Math.random()-.5).slice(0,4).map(f=>({...f,why:f.amount}));

  }
  suggBusy=true;render();

  const diet=MEALS.map(([k,l])=>S.plan.diet[k]?`${l}: ${S.plan.diet[k]}`:"").filter(Boolean).join("\n")||"(diyet listesi yok)";
  const prompt=`Sen Türk mutfağını iyi bilen, dengeli beslenmeyi savunan bir diyetisyen asistanısın.
Kullanıcı için "${ml}" öğününe 3 farklı yemek önerisi hazırla.
- Bugün kalan kalori: ${r0(left)} kcal. Kalan protein: ${Math.max(0,r0(T.protein-t.p))} g, karbonhidrat: ${Math.max(0,r0(T.carbs-t.c))} g, yağ: ${Math.max(0,r0(T.fat-t.f))} g.
- Hedef: ${GOALS.find(g=>g[0]===S.profile.goal)[1]}.
- Bugün yedikleri: ${eaten}.
- Diyet listesi (önerileri buna uygun seç, listede olanları tercih et):
${diet}
- İsteği: ${craving||"yok"}
Kalan kalori çok azsa hafif ve doyurucu seçenekler öner; asla aç kalmayı önerme. Porsiyonu belirt.
Sadece şu JSON'u döndür:
{"items":[{"name":"yemek adı ve porsiyonu","why":"neden uygun, 1 kısa cümle","kcal":0,"protein":0,"carbs":0,"fat":0}]}`;
  try{const r=await askJSON(prompt,{modelTier:"quick"});suggs=normItems(r.items).map((s,i)=>({...s,why:(r.items[i]||{}).why||""}));}
  catch(e){toast(aiErr(e));}
  suggBusy=false;render();
}

function weekStats(off){ // off=1 → dün dahil geriye 7 gün (bugün eksik olduğu için hariç)
  const T=targets();const o={logged:0,kcal:0,p:0,c:0,f:0,water:0,waterOk:0,sport:0,sportPlanned:0,onT:0,tgt:0,wMin:0,burn:0,mod:0,gDays:new Set(),stepSum:0,stepN:0,slSum:0,slN:0,slOk:0};
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-off-i);const k=keyOf(d),dd=S.days[k];
    if(S.plan.sport[(d.getDay()+6)%7])o.sportPlanned++;
    if(!dd)continue;o.water+=dd.water||0;if(dd.water>=T.water)o.waterOk++;if(dd.sport)o.sport++;
    if(dd.foods.length){o.logged++;const t=totals(k);o.kcal+=t.kcal;o.p+=t.p;o.c+=t.c;o.f+=t.f;const g=dayTarget(k);o.tgt+=g;if(t.kcal>=g*.8&&t.kcal<=g*1.1)o.onT++;}
    if(dd.steps>0){o.stepSum+=dd.steps;o.stepN++;}
    {const sh=sleepHours(dd.sleep);if(sh){o.slSum+=sh;o.slN++;if(sleepOk(sh))o.slOk++;}}
    for(const w of (dd.workouts||[])){o.wMin+=w.min;o.burn+=w.kcal;if(w.met>=6)o.mod+=w.min*2;else if(w.met>=3)o.mod+=w.min;if(w.cat==="guc")o.gDays.add(k);}}
  if(o.logged){o.tgt/=o.logged;o.kcal/=o.logged;o.p/=o.logged;o.c/=o.logged;o.f/=o.logged;}
  o.water/=7;return o;
}
function weekCardHTML(){
  const T=targets(),a=weekStats(1),b=weekStats(8),floor=S.profile.sex==="m"?1500:1200,tips=[];
  const box=(l,v)=>`<div><div class="tiny muted">${l}</div><b>${v}</b></div>`;
  if(!a.logged) return `<div class="card" id="weekCard"><h2>🗓️ Haftalık özet</h2><p class="small muted" style="margin:0">Son 7 günde yemek kaydı yok. Birkaç gün kaydedince burada ortalamalarını ve önerileri göreceksin.</p></div>`;
  if(a.logged<4) tips.push(`📝 Son 7 günün sadece ${a.logged} gününde kayıt var. Daha çok gün kaydedersen özet daha doğru olur.`);

  if(a.waterOk<4) tips.push(`💧 Su hedefini 7 günün sadece ${a.waterOk} gününde tamamladın (ort. ${(a.water/1000).toFixed(1).replace(".",",")} L). Telefon bildirimleri yardımcı olabilir.`);

      :av>=10000?`👣 Günde ortalama ${fmtN(av)} adım, çok aktif bir hafta! 👏`:`👣 Günde ortalama ${fmtN(av)} adım attın; bu hafta hedefin ${fmtN(stepGoal())}.`);}
  if(a.slN>=3){const av=a.slSum/a.slN,[mn,mx]=sleepRange();

      :av>mx+1?`😴 Gece ortalama ${fmtDur(av)} uyudun; önerilenden (${mn}–${mx} sa) uzun. Hâlâ yorgun hissediyorsan bir hekime danış.`
      :`😴 Gece ortalama ${fmtDur(av)} uyudun; sağlıklı aralıkta olan gece: ${a.slOk} / ${a.slN}.`);}
  // Dünya Sağlık Örgütü: haftada en az 150 dk orta tempolu hareket (yoğun dakikalar 2 sayılır) + 2 gün güç antrenmanı
  if(a.wMin){const g=a.gDays.size;
    tips.push(a.mod>=150?`🫀 Haftada 150 dakika hareket önerisini tamamladın (${a.mod} dk${a.burn?`, ≈${a.burn} kcal`:""}) 👏`

  if(b.logged>=3&&a.logged>=3&&Math.abs(a.kcal-b.kcal)>=100) tips.push(`📊 Önceki haftaya göre günde ortalama ${r0(Math.abs(a.kcal-b.kcal))} kcal daha ${a.kcal<b.kcal?"az":"fazla"} aldın.`);
  const ws=S.weights.slice().sort((x,y)=>x.date-y.date),cut=Date.now()-7*864e5,bef=ws.filter(w=>w.date<cut).pop(),now=ws[ws.length-1];
  if(bef&&now&&now.date>=cut){const d=now.kg-bef.kg;tips.push(`⚖️ Bu hafta kilon ${Math.abs(d)<.05?"sabit kaldı":(d<0?"":"+")+d.toFixed(1).replace(".",",")+" kg değişti"}.`);}
  return `<div class="card" id="weekCard"><h2>🗓️ Haftalık özet</h2><p class="tiny muted" style="margin:-4px 0 10px">Son 7 gün (bugün hariç)</p>

    ${box("Ort. su",`${(a.water/1000).toFixed(1).replace(".",",")} L`)}${box("Spor",`${a.sport} gün${a.wMin?` · ${a.wMin} dk`:""}`)}${box("Hedef aralığında",`${a.onT} / ${a.logged} gün`)}${box("Kayıt tutulan",`${a.logged} / 7 gün`)}</div>
    <ul class="tips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
}

/* ---- İlerleme: hedef kilo, tartılma serisi, tahmini varış ---- */
const DAY=864e5;
function weightTrend(ws){ // son 8 haftada kg/hafta (en küçük kareler); en az 10 günlük veri gerekir
  const pts=ws.filter(w=>w.date>=Date.now()-56*DAY);if(pts.length<2)return null;
  if((pts[pts.length-1].date-pts[0].date)/DAY<10)return null;
  const xs=pts.map(w=>(w.date-pts[0].date)/(7*DAY)),ys=pts.map(w=>+w.kg),n=xs.length;
  const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let num=0,den=0;
  xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2;});return den?num/den:null;
}
function weighStreak(ws){ // ardışık 7 günlük dilimlerde en az bir tartılma
  const now=Date.now(),W=7*DAY,has=i=>ws.some(w=>w.date>now-(i+1)*W&&w.date<=now-i*W);
  const cur=has(0);let k=cur?0:1,s=0;while(k<80&&has(k)){s++;k++;}
  return {weeks:s,atRisk:!cur&&s>0};
}
function progressHTML(ws){
  const p=S.profile,first=ws[0]||{kg:p.weight,date:Date.now()},last=ws[ws.length-1]||first;
  const now=+last.kg,st=+first.kg,goal=p.goalWeight?+p.goalWeight:null;
  const ago=Math.floor((Date.now()-last.date)/DAY),when=ago<=0?"bugün":ago===1?"dün":ago+" gün önce";
  let mid="";
  if(goal){
    const total=goal-st,done=now-st,dir=Math.sign(total)||1,rem=Math.abs(goal-now);
    const reached=dir<0?now<=goal:now>=goal,pct=reached?1:total?Math.max(0,Math.min(1,done/total)):0;
    const doneTxt=Math.abs(done)<.05?"Henüz değişim yok":done<0?`Şimdiye kadar ${fmtKg(-done)} kg verdin`:`Şimdiye kadar ${fmtKg(done)} kg aldın`;
    mid=`<div class="row between small" style="margin-top:12px"><span class="muted">${doneTxt}</span><b>${reached?"🎉 Hedefe ulaştın!":`Hedefe ${fmtKg(rem)} kg`}</b></div>
      <div class="bar" style="margin-top:6px;height:10px"><i style="width:${(pct*100).toFixed(1)}%;background:var(--green)"></i></div>`;
    const tr=weightTrend(ws);
    if(!reached&&tr!==null){
      const toward=dir*tr; // hedefe doğru kg/hafta
      if(toward>.05){const wk=Math.ceil(rem/toward),d=new Date(Date.now()+wk*7*DAY);
        mid+=`<p class="small" style="margin:10px 0 0">📅 Bu hızla (haftada ${fmtKg(toward)} kg) hedefe yaklaşık <b>${wk} hafta</b> sonra, ${d.toLocaleDateString("tr-TR",{month:"long",year:"numeric"})} civarı ulaşırsın.</p>`;}
      else mid+=`<p class="small muted" style="margin:10px 0 0">📅 Son haftalarda kilon hedef yönünde değişmedi. Haftalık özetteki notlara göz atabilirsin.</p>`;
      if(tr<-1) mid+=`<p class="note warn" style="margin-top:8px">Haftada 1 kg'dan hızlı veriyorsun. Sağlıklı tempo haftada 0,5–1 kg'dır; yeterince yediğinden ve protein aldığından emin ol.</p>`;
    }
  }else mid=`<p class="small muted" style="margin:10px 0 0">🎯 Profiline <b>hedef kilo</b> eklersen ilerleme çubuğu ve tahmini varış süresi görünür. <a href="#" data-act="goProfile" style="color:var(--green-d);font-weight:700">Hedef ekle</a></p>`;
  const sk=weighStreak(ws);
  const streak=sk.weeks
    ?`<div class="streak"><span class="ic">🔥</span><div><b>${sk.weeks} haftalık tartılma serisi</b><div class="tiny muted">${sk.atRisk?"Bu hafta henüz tartılmadın. Seriyi sürdürmek için kilonu gir.":"Serini sürdürmek için kilonu her hafta güncelle."}</div></div></div>`
    :`<div class="streak"><span class="ic">⚖️</span><div><b>Haftada bir tartıl</b><div class="tiny muted">Her hafta kilonu girersen tartılma serin başlar.</div></div></div>`;
  return `<div class="prog-hero"><div class="lbl">Mevcut kilo</div><div class="now">${fmtKg(now)} kg</div><div class="tiny" style="opacity:.85">Son tartılma: ${when}</div>
    <div class="row"><div><div class="lbl">Başlangıç</div><span class="v">${fmtKg(st)} kg</span></div><div><div class="lbl">Hedef</div><span class="v">${goal?fmtKg(goal)+" kg":"—"}</span></div></div></div>
    ${mid}${streak}`;
}

/* ---- Puan, seviye ve seriler ----
   Günlük puan (düzenli ve dengeli davranış ödüllendirilir; az yemek ASLA ödüllendirilmez, kalori puanı sadece hedefin %80-110'u için):
   öğün kaydı 5 (en çok 4 öğün) · kalori hedef aralığında 20 · protein hedefi 15 · su hedefi 20 · antrenman 15 · toplam 30+ dk spor 10 ·
   adım hedefi 15 · sağlıklı uyku süresi 10 · kayıt serisinin her 7. günü 50. Ayrıca: haftada bir tartılma 15, ayda bir ölçü 20, her rozet kendi puanı. */
const PTS={meal:5,kcal:20,protein:15,water:20,workout:15,workout30:10,steps:15,sleep:10,streak7:50,weigh:15,measure:20};
const BADGE_PTS={first_food:25,water_first:25,first_weigh:25,streak3:50,streak7:100,streak30:300,water7:100,protein5:75,balanced:100,sport1:25,sport10:100,
  strength1:25,who150:100,burn1000:100,steps10k:50,sleep7:100,weigh4:100,kg1:100,kg5:250,goal:500,planner:25,fav:25,photo:25,voice:25,barcode:25};
const LEVELS=["Çaylak 🌱","Meraklı 🌿","Kararlı 🍀","Azimli 💪","Disiplinli 🎯","Usta ⭐","Uzman 🏅","Şampiyon 🏆","Efsane 👑"];
const levelNeed=n=>50*(n-1)*n; // n. seviye için gereken toplam puan: 2→100, 3→300, 4→600, 5→1000, 6→1500…
function levelOf(P){let n=1;while(P>=levelNeed(n+1))n++;
  const name=n<=LEVELS.length?LEVELS[n-1]:LEVELS[LEVELS.length-1]+" "+(n-LEVELS.length+1);
  return {n,name,pts:P,cur:levelNeed(n),next:levelNeed(n+1)};}
const isLogged=k=>!!(S.days[k]&&S.days[k].foods.length)||S.rewards.frozen.includes(k);
function streakAt(k){const d=new Date(k+"T12:00:00");let s=0;for(let i=0;i<400&&isLogged(keyOf(d));i++){s++;d.setDate(d.getDate()-1);}return s;}
function logStreak(){const d=new Date();if(!isLogged(keyOf(d)))d.setDate(d.getDate()-1);return streakAt(keyOf(d));}
function bestLogStreak(){return dayRuns(d=>d.foods.length>0,true).max;}
function waterStreak(){const T=targets(),d=new Date(),ok=k=>S.days[k]&&S.days[k].water>=T.water;if(!ok(keyOf(d)))d.setDate(d.getDate()-1);let s=0;for(let i=0;i<400&&ok(keyOf(d));i++){s++;d.setDate(d.getDate()-1);}return s;}
function sportWeekStreak(){ // ardışık 7 günlük dilimlerde en az bir spor günü
  const has=i=>{for(let j=0;j<7;j++){const d=new Date();d.setDate(d.getDate()-i*7-j);const x=S.days[keyOf(d)];if(x&&(x.sport||(x.workouts||[]).length))return true;}return false;};
  let k=has(0)?0:1,s=0;while(k<60&&has(k)){s++;k++;}return s;}
// Bir günün puan kalemleri (bugünkü görevler listesi de bundan çizilir)
function dayPointItems(k){
  const T=targets(),d=S.days[k];if(!T||!d)return [];
  const meals=Math.min(4,new Set(d.foods.map(f=>f.meal)).size),t=totals(k),g=dayTarget(k),ws=d.workouts||[],wm=ws.reduce((a,w)=>a+w.min,0),sk=isLogged(k)?streakAt(k):0;
  return [
    {ic:"🍽️",t:`Öğün kaydı (${meals}/4)`,p:meals*PTS.meal,max:4*PTS.meal,ok:meals>=4},
    {ic:"🎯",t:"Kalori hedef aralığında",p:d.foods.length&&t.kcal>=g*.8&&t.kcal<=g*1.1?PTS.kcal:0,max:PTS.kcal},
    {ic:"🥚",t:"Protein hedefi",p:d.foods.length&&t.p>=T.protein*.9?PTS.protein:0,max:PTS.protein},
    {ic:"💧",t:"Su hedefi",p:d.water>=T.water?PTS.water:0,max:PTS.water},
    {ic:"🏃",t:"Antrenman",p:ws.length||d.sport?PTS.workout:0,max:PTS.workout},
    {ic:"⏱️",t:"30+ dakika spor",p:wm>=30?PTS.workout30:0,max:PTS.workout30},
    {ic:"👣",t:"Adım hedefi",p:d.steps>0&&d.steps>=(d.stepGoal||(k===todayKey()?stepGoal():7000))?PTS.steps:0,max:PTS.steps},
    {ic:"😴",t:"Sağlıklı uyku süresi",p:sleepOk(sleepHours(d.sleep))?PTS.sleep:0,max:PTS.sleep},
    ...(sk>0&&sk%7===0?[{ic:"🔥",t:`${sk}. gün seri bonusu`,p:PTS.streak7,max:PTS.streak7}]:[]),
  ].map(x=>({...x,ok:x.ok??x.p>=x.max}));
}
const dayPoints=k=>dayPointItems(k).reduce((a,x)=>a+x.p,0);
function earnedPoints(){
  if(!targets())return 0;
  const R=S.rewards,today=todayKey();let sum=0,froze=false;
  for(const k of [...new Set([...Object.keys(R.ptsHist),...Object.keys(S.days)])]){
    if(k<today&&R.ptsHist[k]!==undefined){sum+=R.ptsHist[k];continue;}
    if(!S.days[k]||k>today)continue;
    const v=dayPoints(k);sum+=v;
    if(k<today){R.ptsHist[k]=v;froze=true;} // geçmiş gün bir kez hesaplanınca sabitlenir
  }
  if(froze)saveLocal();
  sum+=new Set(S.weights.map(w=>Math.floor((w.date/864e5+3)/7))).size*PTS.weigh;   // hafta (Pazartesi başlangıçlı)
  sum+=new Set(S.measures.map(m=>keyOf(new Date(m.date)).slice(0,7))).size*PTS.measure; // ay
  for(const id in S.badges)sum+=BADGE_PTS[id]||25;
  return sum;
}

function dayRuns(pred,frozenOk){ // ilk kayıttan bugüne her gün için koşul; en uzun ardışık seri (frozenOk: seri koruyucu kullanılan günler sayılır)
  const ks=Object.keys(S.days).sort();if(!ks.length)return {max:0,flags:[]};
  const d=new Date(ks[0]+"T12:00:00"),end=todayKey(),flags=[];let cur=0,max=0;
  for(let i=0;i<400;i++){const k=keyOf(d),ok=!!(S.days[k]&&pred(S.days[k],k))||!!(frozenOk&&S.rewards.frozen.includes(k));flags.push(ok);cur=ok?cur+1:0;max=Math.max(max,cur);if(k>=end)break;d.setDate(d.getDate()+1);}
  return {max,flags};
}
function evalBadges(){
  const T=targets(),ok={};if(!T)return ok;
  const food=dayRuns(d=>d.foods.length>0,true),water=dayRuns(d=>d.water>=T.water);
  ok.first_food=food.flags.some(Boolean);ok.water_first=water.flags.some(Boolean);ok.first_weigh=S.weights.length>=2;
  ok.streak3=food.max>=3;ok.streak7=food.max>=7;ok.streak30=food.max>=30;ok.water7=water.max>=7;
  let pd=0;for(const k in S.days){if(S.days[k].foods.length&&totals(k).p>=T.protein*.9)pd++;}ok.protein5=pd>=5;
  const bal=dayRuns((d,k)=>{if(!d.foods.length)return false;const t=totals(k).kcal,g=dayTarget(k);return t>=g*.8&&t<=g*1.1;}).flags;
  ok.balanced=bal.some((_,i)=>i>=6&&bal.slice(i-6,i+1).filter(Boolean).length>=5);
  const sportN=Object.values(S.days).filter(d=>d.sport).length;ok.sport1=sportN>=1;ok.sport10=sportN>=10;
  const allW=Object.values(S.days).flatMap(d=>d.workouts||[]);
  ok.steps10k=Object.values(S.days).some(d=>d.steps>=10000);ok.sleep7=dayRuns(d=>sleepOk(sleepHours(d.sleep))).max>=7;
  ok.strength1=allW.some(w=>w.cat==="guc");ok.burn1000=allW.reduce((a,w)=>a+(+w.kcal||0),0)>=1000;
  { const mods=[];const ks=Object.keys(S.days).sort();if(ks.length){const d=new Date(ks[0]+"T12:00:00"),end=todayKey();
      for(let i=0;i<400;i++){const k=keyOf(d);mods.push(workoutsOf(k).reduce((a,w)=>a+(w.met>=6?w.min*2:w.met>=3?w.min:0),0));if(k>=end)break;d.setDate(d.getDate()+1);}}
    ok.who150=mods.some((_,i)=>mods.slice(Math.max(0,i-6),i+1).reduce((a,b)=>a+b,0)>=150); }
  const ws=S.weights.slice().sort((a,b)=>a.date-b.date);ok.weigh4=weighStreak(ws).weeks>=4;
  if(ws.length>=2){const st=+ws[0].kg,now=+ws[ws.length-1].kg,g=S.profile.goalWeight?+S.profile.goalWeight:null;
    const dir=g?Math.sign(g-st):S.profile.goal==="gain"?1:S.profile.goal==="lose"?-1:0;
    if(dir){const moved=(now-st)*dir;ok.kg1=moved>=1;ok.kg5=moved>=5;if(g)ok.goal=dir<0?now<=g:now>=g;}}
  ok.planner=Object.values(S.plan.diet).some(v=>v&&v.trim())||Object.values(S.plan.sport).filter(v=>v&&v.trim()).length>=3;
  ok.fav=S.favs.length>0;ok.photo=S.stats.photo>0;ok.voice=S.stats.voice>0;ok.barcode=S.stats.barcode>0;
  return ok;
}

/* ---- Kilo grafiği (tek seri çizgi grafik, noktaya dokununca değer görünür) ---- */
const fmtKg=v=>(Math.round(v*10)/10).toFixed(1).replace(".",",");
const fmtD=d=>new Date(d).toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
let wPts=[];
function weightChartHTML(all){
  const ws=all.slice(-30);wPts=ws;
  const W=320,H=150,L=34,R=44,Tp=12,B=22;
  const goal=S.profile.goalWeight?+S.profile.goalWeight:null;
  const kg=ws.map(w=>+w.kg),rng=goal?[...kg,goal]:kg;let lo=Math.min(...rng),hi=Math.max(...rng);const pv=Math.max(.5,(hi-lo)*.12);
  lo=Math.floor((lo-pv)*2)/2;hi=Math.ceil((hi+pv)*2)/2;
  const t0=ws[0].date,span=ws[ws.length-1].date-t0;
  const x=(w,i)=>L+(span>0?(w.date-t0)/span:i/(ws.length-1))*(W-L-R);
  const y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  const P=ws.map((w,i)=>[x(w,i),y(+w.kg)]);
  const grid=[hi,(hi+lo)/2,lo].map(v=>`<line x1="${L}" x2="${W-R+6}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${fmtKg(v)}</text>`).join("");
  const line="M"+P.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L");
  const lp=P[P.length-1],first=ws[0],last=ws[ws.length-1],df=last.kg-first.kg;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo grafiği: ${fmtD(first.date)} ${fmtKg(first.kg)} kg, ${fmtD(last.date)} ${fmtKg(last.kg)} kg">
    ${grid}
    ${goal?`<line x1="${L}" x2="${W-R+6}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${(y(goal)-5).toFixed(1)}" style="fill:var(--orange)">Hedef ${fmtKg(goal)}</text>`:""}
    <path d="${line}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${P.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--green)" stroke="var(--card)" stroke-width="2"/>`).join("")}
    <text x="${(lp[0]+8).toFixed(1)}" y="${(lp[1]+3).toFixed(1)}" style="fill:var(--ink);font-size:11px">${fmtKg(last.kg)}</text>
    <text x="${L}" y="${H-5}" text-anchor="start">${fmtD(first.date)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${fmtD(last.date)}</text>
    ${P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="13" fill="transparent" data-act="wPt" data-i="${i}" style="cursor:pointer"><title>${fmtD(ws[i].date)}: ${fmtKg(ws[i].kg)} kg</title></circle>`).join("")}
  </svg>
  <div class="tiny muted" id="wInfo" style="text-align:center;min-height:16px">Noktaya dokununca tarih ve kilo görünür</div>
  <p class="small" style="margin:6px 0 0;text-align:center">${fmtD(first.date)}: <b>${fmtKg(first.kg)} kg</b> → şimdi <b>${fmtKg(last.kg)} kg</b> <span style="color:${df<=0?"var(--green-d)":"var(--orange)"};font-weight:800">(${df>0?"+":""}${fmtKg(df)})</span></p>`;
}

    case "dietUndo":{e.preventDefault();if(diet.undo){S.plan.diet={...diet.undo};diet.undo=null;diet.msg="Eski liste geri getirildi.";diet.warn=false;save();render();}break;}
    case "stepSave":{const raw=document.getElementById("stepIn").value.trim();if(!raw)return toast("Adım sayını yaz");setSteps(raw);break;}
    case "stepPaste":navigator.clipboard.readText().then(t=>setSteps(t)).catch(()=>toast("Panodaki sayı okunamadı; kutuya yapıştırabilirsin"));break;
    case "stepGoalSave":{const raw=document.getElementById("stepGoalIn").value.trim(),n=Math.round(numTR(raw.replace(/\./g,"")));
      if(raw&&!(n>=1000&&n<=50000))return toast("Hedefi 1.000 ile 50.000 arasında gir");S.settings.stepGoal=raw?n:0;save();render();toast(raw?`Adım hedefin: ${fmtN(n)}`:"Adım hedefi otomatik");break;}
    case "slQ":sleepQ=+el.dataset.q;document.querySelectorAll('[data-act="slQ"]').forEach(b=>b.classList.toggle("on",+b.dataset.q===sleepQ));break;
    case "sleepEdit":e.preventDefault();sleepEdit=true;render();break;
    case "sleepSave":{const b=document.getElementById("slBed").value,w=document.getElementById("slWake").value,sl={bed:b,wake:w,q:sleepQ||0},h=sleepHours(sl);
      if(!h)return toast("Saatleri kontrol et (uyku 16 saatten uzun olamaz)");
      if(h<2&&!confirm(`Sadece ${fmtDur(h)} uyumuş görünüyorsun. Doğru mu?`))break;
      day().sleep=sl;sleepEdit=false;sleepQ=0;save();render();toast(`😴 ${fmtDur(h)} uyku kaydedildi${sleepOk(h)?" · sağlıklı aralıkta ✓":""}`);break;}
    case "goPoints":closeModal();setTab("me");setTimeout(()=>document.getElementById("ptsCard")?.scrollIntoView({behavior:"smooth",block:"start"}),50);break;
    case "buyFreeze":if(spend("Seri koruyucu",FREEZE_COST)){S.rewards.freezes++;save();render();toast("🧊 Seri koruyucu alındı");}break;
    case "useFreeze":case "buyUseFreeze":{const s=freezeChance();if(s<2)break;
      if(a==="buyUseFreeze"){if(!spend("Seri koruyucu",FREEZE_COST))break;S.rewards.freezes++;}
      if(S.rewards.freezes<1)break;S.rewards.freezes--;S.rewards.frozen.push(yKey());save();render();toast(`🧊 Serin korundu: ${logStreak()} gün`);break;}
    case "theme":{const id=el.dataset.id,th=THEMES.find(x=>x[0]===id);if(!th)break;const R=S.rewards;
      if(th[3]&&!R.themes.includes(id)){if(!spend("Tema: "+th[1],th[3]))break;R.themes.push(id);toast(`🎨 ${th[1]} teması açıldı`);}
      R.theme=id;save();render();setTimeout(()=>document.getElementById("rewardsCard")?.scrollIntoView({block:"center"}),30);break;}
    case "addReward":{const n=(document.getElementById("rwName").value||"").trim().slice(0,60),c=Math.round(numTR(document.getElementById("rwCost").value));
      if(!n)return toast("Ödülün adını yaz");if(!(c>=50&&c<=1000000))return toast("Puanı en az 50 olarak gir");
      S.rewards.custom.push({id:uid(),name:n,cost:c});save();render();setTimeout(()=>document.getElementById("rewardsCard")?.scrollIntoView({block:"center"}),30);toast("🎁 Ödül eklendi");break;}
    case "delReward":S.rewards.custom=S.rewards.custom.filter(x=>x.id!==el.dataset.id);save();render();break;
    case "claimReward":{const c=S.rewards.custom.find(x=>x.id===el.dataset.id);if(!c)break;
      // Yanlışlıkla harcanmasın: 4 saniye içinde ikinci dokunuş onaylar
      if(!(claimArm.id===c.id&&Date.now()-claimArm.t<4000)){claimArm={id:c.id,t:Date.now()};toast(`${c.cost} puan harcanacak. Onaylamak için tekrar dokun`);break;}
      claimArm={};if(!spend("🎁 "+c.name,c.cost))break;S.rewards.custom=S.rewards.custom.filter(x=>x.id!==c.id);save();render();
      simpleModal(`<div class="tiny" style="font-weight:800;letter-spacing:.6px;color:var(--green-d)">ÖDÜLÜNÜ HAK ETTİN!</div><div class="big">🎉</div><h2 style="justify-content:center;margin:4px 0 6px">${esc(c.name)}</h2>
        <p class="small muted" style="margin:0 0 6px">${c.cost.toLocaleString("tr-TR")} puanını kullandın. Emeğinin karşılığı, tadını çıkar!</p><button class="btn full" style="margin-top:10px" data-act="closeModal">Teşekkürler!</button>`);break;}
    case "toggleWeekly":S.settings.weeklyOn=!S.settings.weeklyOn;save();render();break;
    case "voiceStart":voiceStart();break;
    case "voiceStop":voiceStop(true);break;
    case "ptag":{const i=+el.dataset.i,box=document.querySelectorAll(".res-item")[i];if(!box)break;
      document.querySelectorAll(".res-item.hl").forEach(x=>x.classList.remove("hl"));box.classList.add("hl");
      box.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>box.classList.remove("hl"),2500);break;}
    case "goProfile":{e.preventDefault();const g=document.getElementById("pGoalW");if(g){g.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>g.focus(),400);}break;}
    case "logMeasure":{const m={date:Date.now()};let n=0,bad="";
      for(const [k,label,,lo,hi] of MEASURES){const raw=document.getElementById("m_"+k).value.trim();if(!raw)continue;const v=numTR(raw);
        if(v>=lo&&v<=hi){m[k]=v;n++;}else bad=label;}
      if(bad)return toast(`${bad} ölçüsünü cm olarak kontrol et`);if(!n)return toast("En az bir ölçüyü cm olarak gir");
      S.measures.push(m);save();render();toast(`${n} ölçü kaydedildi 📏`);break;}
    case "badgeInfo":{const b=BADGES.find(x=>x[0]===el.dataset.id);if(b)showBadgeModal([b],false);break;}
    case "closeModal":closeModal();break;
    case "allBadges":closeModal();setTab("me");setTimeout(()=>document.getElementById("badgesCard")?.scrollIntoView({behavior:"smooth",block:"start"}),50);break;
    case "getSugg":getSugg();break;
    case "addSugg":{const s=suggs[+el.dataset.i];const d=day();d.foods.push({id:uid(),meal:addMeal,name:s.name,amount:"",kcal:s.kcal,p:s.p,c:s.c,f:s.f,t:Date.now()});save();toast("Eklendi ✓");break;}
    case "logWeight":{const v=numTR(document.getElementById("wIn").value);if(!(v>=30&&v<=300))return toast("Geçerli bir kilo gir");S.weights.push({date:Date.now(),kg:v});S.profile.weight=v;save();render();toast("Kilo kaydedildi, hedefler güncellendi");break;}
    case "pushOn":enablePush();break;
    case "pushOff":disablePush();break;
    case "toggleRem":S.settings.reminders=!S.settings.reminders;save();render();
      break;
    case "remMin":S.settings.reminderMin=+el.dataset.m;save();render();break;
    case "glass":S.settings.glass=+el.dataset.m;save();render();break;
    case "exportData":{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="kalori-yedek-"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();toast("Yedek indirildi ✓");break;}
    case "reset":if(Date.now()-resetArm<4000){if(S.settings.push)disablePush();S=defaultState();save();TAB="today";render();toast("Sıfırlandı");}else{resetArm=Date.now();toast("Emin misin? Silmek için tekrar dokun");}break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="searchIn"){viewAdd._q=t.value;document.getElementById("searchRes").innerHTML=searchHTML(t.value);}
  if(t.id==="foodText")viewAdd._txt=t.value;
  if(t.id==="bcIn")bcCode=t.value;
  if(t.id==="photoNote")viewAdd._pnote=t.value;
  if(t.id==="wkText")wk.text=t.value;
  if(t.id==="dietPasteTxt")diet.pasteTxt=t.value;
  if(t.id==="wkMin"){const m=Math.round(numTR(t.value));if(m>=1&&m<=600){wk.min=m;const sp=sportByKey(wk.key);const o=document.getElementById("wkKcal");if(o&&sp)o.innerHTML=wkKcalTxt(burnKcal(sp.met[wk.int],m,S.profile.weight));}}
  if(t.id==="craving")viewSugg._c=t.value;
  if(t.dataset&&t.dataset.pi!==undefined){const f=pending[+t.dataset.pi];if(!f)return;const k=t.dataset.k;f[k]=(k==="name"||k==="amount")?t.value:+t.value;
    const sumEl=document.querySelector(".card .row.between b");}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="photoIn"&&t.files&&t.files[0]){try{photoBlob=await resizeImage(t.files[0]);if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(photoBlob);photoSeq++;render();}catch(err){toast("Fotoğraf okunamadı");}}
  if(t.id==="importIn"&&t.files&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!j||typeof j!=="object"||!("days" in j))throw 0;S=normalizeState(j);save();TAB="today";render();toast("Yedek yüklendi ✓");}catch(err){toast("Yedek dosyası okunamadı");}}
  // Spor planı satırı değişti (data-pk: spor, data-pm: dakika, data-pn: yoğunluk; değer "gün:sıra")
  const pa=t.dataset&&(t.dataset.pk||t.dataset.pm||t.dataset.pn);
  if(pa){const [i,j]=pa.split(":").map(Number),it=(S.plan.sportItems[i]||[])[j];if(it){
    if(t.dataset.pk&&sportByKey(t.value))it.key=t.value;
    if(t.dataset.pm){const m=Math.round(numTR(t.value));it.min=m>=5&&m<=600?m:(it.min||30);}
    if(t.dataset.pn)it.int=+t.value||0;
    planSync(i);}}
  if(t.id==="dietPhotoIn"&&t.files&&t.files.length){const fs=[...t.files];t.value="";dietFromPhotos(fs);}
  if(t.dataset&&t.dataset.mealtime){S.settings.mealRem.t[t.dataset.mealtime]=/^\d{2}:\d{2}$/.test(t.value)?t.value:"";save();}
  if(t.id==="wakeS"||t.id==="wakeE"){S.settings.wakeStart=+document.getElementById("wakeS").value;S.settings.wakeEnd=+document.getElementById("wakeE").value;save();}
  if(t.dataset&&t.dataset.pi!==undefined){render();showPreview();}
});

/* ============ Su hatırlatıcı (uygulama açıkken) ============ */
let lastRemind=Date.now();
function checkReminder(){
  const st=S.settings;if(!S.profile||!st.reminders)return;
  const h=new Date().getHours();if(h<st.wakeStart||h>=st.wakeEnd)return;
  const d=day(),T=targets();if(d.water>=T.water)return;
  if(Date.now()-lastRemind>=st.reminderMin*60000){
    lastRemind=Date.now();
    document.getElementById("remindTxt").textContent=`Bugün ${(d.water/1000).toFixed(1)} L içtin, hedefin ${(T.water/1000).toFixed(1)} L.`;
    document.getElementById("remind").classList.add("show");
    try{if(!S.settings.push&&document.hidden&&"Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker){navigator.serviceWorker.ready.then(r=>r.showNotification("💧 Su içme zamanı!",{body:document.getElementById("remindTxt").textContent,icon:"icon-192.png",tag:"water"}));}}catch(e){}
    try{navigator.vibrate&&navigator.vibrate([120,80,120]);}catch(e){}
  }
}
document.getElementById("remindAdd").onclick=()=>{const d=day();d.water+=S.settings.glass;save();document.getElementById("remind").classList.remove("show");render();toast("+"+S.settings.glass+" ml 💧");};
document.getElementById("remindLater").onclick=()=>{document.getElementById("remind").classList.remove("show");lastRemind=Date.now()-Math.max(0,S.settings.reminderMin-15)*60000;};
/* ---- Öğün hatırlatıcı (uygulama açıkken; kapalıyken Worker bildirim gönderir) ---- */
const mealShown=new Set();let mealBannerMeal="";
function checkMealReminder(){
  if(!S.profile||!S.settings.mealRem.on||document.hidden)return;
  const now=new Date(),mins=now.getHours()*60+now.getMinutes(),k=todayKey(),bits=mealBitsToday();
  MEALS.forEach(([mk,l],i)=>{const t=hmToMin(S.settings.mealRem.t[mk]);const id=k+mk;
    if(t<0||mealShown.has(id)||bits&(1<<i))return;
    if(mins>=t&&mins<t+30){mealShown.add(id);mealBannerMeal=mk;
      document.getElementById("remindMealT").textContent=l.replace(/^(\S+)\s(.*)$/,"$1 $2")+" zamanı";
      document.getElementById("remindMeal").classList.add("show");try{navigator.vibrate&&navigator.vibrate(100);}catch(e){}}});
}
document.getElementById("remindMealAdd").onclick=()=>{document.getElementById("remindMeal").classList.remove("show");if(mealBannerMeal)addMeal=mealBannerMeal;setTab("add");};
document.getElementById("remindMealLater").onclick=()=>document.getElementById("remindMeal").classList.remove("show");
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();checkReminder();checkMealReminder();}});
setInterval(()=>{checkReminder();checkMealReminder();},30000);

/* ============ Başlat ============ */
loadLocal();render();
function addGlassFromNotification(){if(!S.profile)return;const d=day();d.water+=S.settings.glass;save();TAB="today";render();toast("+"+S.settings.glass+" ml 💧 eklendi");}
// Bildirimden gelen bağlantılar: #su-ekle → 1 bardak su; #ogun-ogle → Ekle sekmesi, o öğün seçili
function handleHash(h){
  if(h==="#su-ekle"){addGlassFromNotification();return true;}
  const m=/^#ogun-(kahvalti|ogle|aksam|ara)$/.exec(h||"");
  if(m&&S.profile){addMeal=m[1];document.getElementById("remindMeal").classList.remove("show");setTab("add");return true;}
  const sm=/^#adim=(\d{1,6})$/.exec(h||"");if(sm&&S.profile){setTab("today");setSteps(sm[1]);return true;}
  if(h==="#rapor"&&S.profile){setTab("me");setTimeout(()=>document.getElementById("weekCard")?.scrollIntoView({behavior:"smooth",block:"start"}),50);return true;}
  return false;
}
function checkWaterHash(){const h=location.hash;if(h==="#su-ekle"||h==="#rapor"||/^#ogun-/.test(h)||/^#adim=/.test(h)){history.replaceState(null,"",location.pathname+location.search);handleHash(h);}}
checkWaterHash();window.addEventListener("hashchange",checkWaterHash);
if("serviceWorker" in navigator){navigator.serviceWorker.addEventListener("message",e=>{if(!e.data)return;if(e.data.type==="add-water")addGlassFromNotification();if(e.data.type==="open")handleHash(e.data.hash);});}
setTimeout(checkMealReminder,1500);
setTimeout(checkBadges,1200); // güncellemeden sonra geçmiş verilerle hak edilmiş rozetler de verilir
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if("serviceWorker" in navigator&&window.isSecureContext){navigator.serviceWorker.register("sw.js").catch(()=>{});}
